      - look: 予安
      - 旁白: 窗邊的桌上，筆電開著。杯子放在手邊，一直沒動。
      - 德叔: 窗邊那位小姐，從開門就坐在那裡。
      - 德叔: 她把同一句話刪了三次。

  yuan2:
    journal:
      - 予安小姐的筆電沒電。跟我借了筆，在紙巾上寫到打烊。
      - 她說：「奇怪，寫在紙巾上反而寫得出來。」
      - 那張紙巾她留在桌上，說給店裡。我收進倉庫了。
    scene:
      - look: 予安
      - 旁白: 筆電的螢幕黑了。她按了兩下電源鍵，沒反應。
      - 予安: 啊……筆電沒電了。
      - 予安: 德叔，可以跟你借一支筆嗎？
      - deshuTo: 予安
      - { do: pose, who: 予安, pose: napkin }
      - deshuHome
      - wait: 3
      - 予安: 奇怪，寫在紙巾上反而寫得出來。
      - wait: 2
      - 旁白: 她寫到一半停下來，筆懸著，又繼續。
      - 德叔: 那張紙巾，她說要留給店裡。我收在倉庫，老闆想擺就擺。

  yuan3:
    waiting: 予安小姐今天門一響就抬頭。看到不是老闆，又低下去。
    scene:
      - look: 予安
      - 旁白: 她把筆電闔上一半，手還放在上面。
      - 予安: 老闆，我好像一直沒說過我在寫什麼。
      - 予安: 我在寫我阿公的龍眼窯。
      - 予安: 窯熄了以後，阿公就很少說話了。我想把那個煙寫回來。
      - wait: 2

  yuan4:
    waiting: 予安小姐今天筆電沒開。手機翻過來又翻回去，看了一下午。
    scene:
      - look: 予安
      - 旁白: 筆電沒開。手機放在桌上，螢幕朝上，她看了一眼又翻過去。
      - 予安: ……退稿了。
      - wait: 2
      - 予安: 我是不是該回台北上班了。
      - { do: serve, who: 予安, kind: cocoa }
      - 德叔: 喝完再想。
      - wait: 2
      - 予安: ……我沒有點這個。
      - 德叔: 我知道。

  yuan5:
    waiting: 予安小姐問我，老闆晚上會待到打烊嗎。我說不一定。
    needClosingHint: 予安小姐說，今天想等打烊以後再走。
    note: 打烊後：老闆按「打烊」、喝完最後一杯，其他客人都走了，予安還在（D57、D78）
    scene:
      - look: 予安
      - 旁白: 椅子都收了，窗邊那桌還亮著。她手裡有幾張印出來的紙。
      - 予安: 老闆，打烊了，我可以再待一下嗎？
      - 予安: 我想把稿子念給你聽。只念一小段。
      - choice: listen
        options:
          - listen: 好，你念。
      - { do: pose, who: 予安, pose: read }
      - { do: cat, who: 予安, lap: false }
      - { do: read, doc: manuscript }
      - 予安: ……龍眼睡著了。我念得那麼無聊嗎。
      - 予安: ……就到這裡。後面還沒寫好。
      - { do: pose, who: 予安, pose: type }
      - wait: 1.5
      - leave: 予安

  yuan6:
    waiting: 予安小姐抱著一個牛皮紙袋來，放在桌上沒打開。她說等老闆在。
    scene:
      - look: 予安
      - 旁白: 牛皮紙袋放在桌上，封口的膠帶撕了一半。
