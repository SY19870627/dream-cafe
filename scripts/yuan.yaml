# 林予安（卡稿的作家）
# segments：來訪段落（陌生 → 點單寒暄 → 閒聊 → 說出身世 → 請咖啡；src/visits.js 排程）
# milestones：六個里程碑的演出（scene）、營業日誌（journal）、想等老闆在的提示（waiting）；條件與順序在 src/story.js
# 沒寫 tag 的句子都是【待定】；tag: 原句＝已上線的句子搬進段落、tag: 劇本＝docs/第一站劇本.md 的原文。寫法見 docs/劇本格式.md

segments:
  - id: yuan-v1
    note: 第 1 次｜陌生（與 yuan1 同天）
    who: yuan
    kind: with
    with: yuan1
    steps:
      - when: peeked
        steps:
          - 德叔: 昨天在門口看了很久的那位小姐，今天一開門就進來了。
      - when: not peeked
        steps:
          - 德叔: 窗邊來了一位小姐。一開門就進來了。
      - deshuTo: 予安
      - 德叔: 要喝什麼？慢慢看。
      - 予安: ……黑咖啡。
      - 德叔: 熱的？
      - 予安: 嗯。謝謝。
      - deshuHome
      - { do: serve, who: 予安, kind: hot }
      - deshuHome
      - { do: pose, who: 予安, pose: type }
      - 德叔: 她只看了黑板一眼，就知道要什麼。
      - wait: 3
      - 予安: ……不對。
        note: 小聲，對著螢幕
      - choice: vYuan1Note
        options:
          - writing: 她好像在寫東西。
            then:
              - 德叔: 打字的聲音，停停走走。
          - quiet: 我們小聲一點。
            then:
              - 德叔: 嗯。
      - wait: 4
      - look: 予安
      - 德叔: 窗邊那位小姐，從開門就坐在那裡。
        tag: 原句
        note: yuan1
      - 德叔: 她把同一句話刪了三次。
        tag: 原句
        note: 劇本
      - when: catSill
        steps:
          - 德叔: 龍眼在窗台上睡，她在窗台下面寫。
      - choice: vYuan1Stay
        options:
          - stay: 讓她坐到打烊吧。
      - 德叔: 本來就是這樣。

  - id: yuan-v2
    note: 第 2 次｜點單寒暄（yuan1 之後、yuan2 之前）
    who: yuan
    kind: visit
    after: 1
    before: 2
    steps:
      - look: 予安
      - 德叔: 她又坐窗邊了。
      - deshuTo: 予安
      - 德叔: 一樣？
      - 予安: 嗯。一樣。
      - { do: serve, who: 予安, kind: hot }
      - 德叔: 這位是老闆。店，是老闆的。
      - choice: vYuan2Hello
        options:
          - hello: 你好，慢慢坐。
            then:
              - when: not met
                steps:
                  - 予安: ……啊，你好。我叫予安，常坐在這裡寫稿。
                    tag: 原句
                    note: 原本第一次點她時說的那句（main.js talkTo），搬到這裡；舊存檔已經聽過就不再說
                  - { do: mark, flag: metYuan }
              - 你: 想坐多久都可以。
              - 予安: ……謝謝。我會小聲一點打字。
          - nod: （點點頭）
            then:
              - 予安: ……你好。
              - 德叔: 點過頭了。這樣就算打過招呼。
                # AI 味檢核 O6：去掉「在這裡，」
      - deshuHome
      - { do: pose, who: 予安, pose: type }
      - wait: 5
      - 予安: 這句我又刪掉了。
        tag: 原句
        note: TALK
      - 德叔: 那一句，她打了很久。
      - wait: 4
      - { do: serve, who: 予安, kind: hot }
      - { do: mark, early: d2-refill }
      - 予安: 謝謝。
      - 予安: 窗外那片山，今天的顏色很好看。
        tag: 原句
        note: TALK
      - choice: vYuan2Hill
        options:
          - later: 晚一點會更好看。
            note: 不說「下午」：多半下班後進店，夜裡也成立
            then:
              - 予安: 那我晚一點再走。
          - look: （一起看一下窗外）
            then:
              - look: 窗外
              - wait: 3
              - 予安: ……嗯。
      - deshuHome
      - 德叔: 她今天，多說了一句。

  - id: yuan-v3
    note: 第 3 次｜閒聊的開始（與 yuan2 借筆同天）
    who: yuan
    kind: with
    with: yuan2
    steps:
      - deshuTo: 予安
      - 德叔: 黑的。
      - 予安: 嗯。……謝謝德叔。
      - { do: serve, who: 予安, kind: hot }
      - deshuHome
      - { do: pose, who: 予安, pose: type }
      - wait: 6
      - 予安: 啊……筆電沒電了。
        tag: 原句
        note: yuan2
      - choice: vYuan3Plug
        options:
          - plug: 吧台那邊有插座嗎？
            then:
              - 德叔: 插座在吧台底下，線拉不過去。
          - glance: （看向德叔）
            then:
              - glance: 德叔
      - 予安: 德叔，可以跟你借一支筆嗎？
        tag: 原句
        note: yuan2
      - deshuTo: 予安
      - { do: pose, who: 予安, pose: napkin }
      - deshuHome
      - 德叔: 紙巾是她自己拿的。我沒說可以，也沒說不行。
      - wait: 3
      - 予安: 奇怪，寫在紙巾上反而寫得出來。
        tag: 原句
        note: 劇本
      - choice: vYuan3Napkin
        options:
          - more: 那就多拿幾張。
            then:
              - 予安: ……那我不客氣了。
          - fine: 寫得出來就好。
            then:
              - 予安: 嗯。……今天好像可以。
      - wait: 4
      - 予安: 這張……可以留在店裡嗎？
      - 德叔: 那張紙巾，她說要留給店裡。我收在倉庫，老闆想擺就擺。
        tag: 原句
        note: yuan2
      - 德叔: 寫滿了。背面也是。
      - wait: 3
      - 予安: 德叔，筆可以先借我到打烊嗎？
      - 德叔: 不用還。

  - id: yuan-r2
    note: yuan2 沒有演到擴寫版（離線、或老闆站著）：之後第一次見到她時的接回（取代第 3 次）
    who: yuan
    kind: reconnect
    of: yuan2
    after: 2
    before: 3
    steps:
      - look: 予安
      - 德叔: 那天的紙巾，我收在倉庫了。
      - 予安: 那天寫的，我後來都打進去了。
        # AI 味檢核 O7：開頭不加「……」

  - id: yuan-v4
    note: 第 4 次｜閒聊（問她才答，說到一半停住；yuan2 之後、yuan3 之前）
    who: yuan
    kind: visit
    after: 2
    before: 3
    steps:
      - look: 予安
      - 德叔: 她今天寫得比較多。打字的聲音，沒有停。
      - choice: vYuan4Ask
        options:
          - ask: 德叔，她在寫什麼？
            then:
              - 德叔: 我沒問。她的事，等她想說再說。
          - leave: 那就別打擾她。
            then:
              - 德叔: 嗯。
      - wait: 5
      - 予安: 德叔，可以再一杯嗎？
      - 德叔: 黑的。
      - { do: serve, who: 予安, kind: hot }
      - 予安: 謝謝。
      - choice: vYuan4Write
        options:
          - going: 今天寫得順嗎？
            then:
              - 予安: ……比昨天多一頁。
              - 予安: 不過明天，大概又會刪掉。
          - bright: 窗邊會不會太亮？
            then:
              - 予安: 剛好。亮一點，比較不會睡著。
              - 予安: ……不對，不是這間店讓人想睡。
                # AI 味檢核 N1：予安改口用「不對」，「我是說」留給凱文
      - deshuHome
      - 旁白: 窗外的路很安靜，兩邊的樹一棵接一棵。
        note: 示範旁白（D224），等 fable 重寫
      # 先轉到窗外停一拍，老闆才開口（fable 第二輪）
      - look: 窗外
      - wait: 4
      - 你: 這條路兩邊，都是龍眼樹。
        note: fable 換時機：老闆先說，她才接
      - look: 予安
      - 予安: 我阿公以前也在這條路上烤龍眼。
        tag: 原句
        note: TALK
      - choice: vYuan4Longan
        options:
          - roast: 烤龍眼？
            then:
              - 予安: ……嗯。很久以前了。
          - wait: （等她說下去）
            then:
              - wait: 3
              - 予安: ……沒事。我繼續寫。
      - { do: pose, who: 予安, pose: type }
      - 德叔: 沒關係。話說到一半的人，通常還會回來說完。
        note: 全篇只用這一次；yuan3 的「她說完了。」兌現
      - wait: 4
      - 予安: ……這段，先留著。
      - when: catSill
        steps:
          - { do: catMove, kind: roll }
          - 德叔: 龍眼在窗台上翻了個身。
            # AI 味檢核 O2：只留翻身的事實，不替貓配旁白

  - id: yuan-v5
    note: 第 5 次｜閒聊（yuan3 前一次）
    who: yuan
    kind: visit
    after: 2
    before: 3
    steps:
      - { do: serve, who: 予安, kind: hot }
      - 德叔: 第二杯。
        note: AI 味檢核 N3：她不回「謝謝」，埋著頭
      - deshuHome
      - wait: 3
      - 予安: 紙巾上的，打進去就不對了。
        note: 看著紙巾，又看筆電
      - choice: vYuan5Napkin
        options:
          - napkin: 那就先寫在紙巾上。
            then:
              - 予安: 嗯。德叔，紙巾可以再給我幾張嗎？
              - 德叔: 整包。
          - nod: （點點頭）
            then:
              - 予安: ……嗯。
      - 德叔: 她今天，抬頭看了門口兩次。

  - id: yuan-v6
    note: 第 6 次｜yuan3：原句 3 句之後，德叔「她說完了。」（兩個分支都聽得到），再自然問第一杯
    who: yuan
    kind: with
    with: yuan3
    steps:
      - look: 予安
      - 予安: 老闆，我好像一直沒說過我在寫什麼。
        tag: 原句
        note: yuan3
      - 予安: 我在寫我阿公的龍眼窯。
        tag: 原句
        note: yuan3
      - 予安: 窯熄了以後，阿公就很少說話了。我想把那個煙寫回來。
        tag: 原句
        note: yuan3
      - wait: 2
      - 德叔: 她說完了。
    invite:
      drink: black
      options:
        - treat: 再一杯黑咖啡？我請。
          then:
            - 予安: ……好。
              # AI 味檢核 N2：端對時 favorites 的 ok 已經有「謝謝」，這裡不疊
        - later: 慢慢寫。
          then:
            - 予安: ……嗯。謝謝你聽。
      missing:
        # 黑板上沒有黑咖啡時；只陳述，接著的選杯標題才問
        - 予安: ……好。
        - 德叔: 黑板上現在沒有黑咖啡。

  - id: yuan-r3
    note: yuan3 已經發生、結尾的第一杯沒有問到：之後第一次見到她時只補那個邀請（沒有新句，選項與分支就是 yuan-v6 的 invite）
    who: yuan
    kind: reconnect
    of: yuan3
    uninvited: true
    after: 3
    before: 4
    steps:
      - look: 予安
    invite: yuan-v6

milestones:
  yuan1:
    journal:
      - 窗邊來了一位小姐，筆電開著一頁空白的檔案，從開門坐到打烊。
      - text: 她把同一句話刪了三次。
        tag: 劇本
    scene:
      - wait: 4
      - 德叔: 窗邊那位小姐，從開門就坐在那裡。
      - 德叔: 她把同一句話刪了三次。
        tag: 劇本

  yuan2:
    journal:
      - 予安小姐的筆電沒電了，跟我借了一支筆，在紙巾上寫了一個下午。
      - text: 她說：「奇怪，寫在紙巾上反而寫得出來。」
        tag: 劇本
      - 走的時候，桌上留了一張寫滿字的紙巾。我收在倉庫了。
    scene:
      - 予安: 啊……筆電沒電了。
      - 予安: 德叔，可以跟你借一支筆嗎？
      - deshuTo: 予安
      - { do: pose, who: 予安, pose: napkin }
      - deshuHome
      - wait: 3
      - 予安: 奇怪，寫在紙巾上反而寫得出來。
        tag: 劇本
      - wait: 2
      - 德叔: 那張紙巾，她說要留給店裡。我收在倉庫，老闆想擺就擺。

  yuan3:
    waiting: 予安小姐今天抬頭看了門口好幾次。大概有話，想等老闆在的時候說。
    scene:
      - look: 予安
      - 予安: 老闆，我好像一直沒說過我在寫什麼。
      - 予安: 我在寫我阿公的龍眼窯。
      - 予安: 窯熄了以後，阿公就很少說話了。我想把那個煙寫回來。
        tag: 劇本
      - wait: 2

  yuan4:
    waiting: 予安小姐今天寫得很少，一直在看手機。好像在等什麼消息。
    scene:
      - look: 予安
      - 予安: ……退稿了。
      - wait: 2
      - 予安: 我是不是該回台北上班了。
        tag: 劇本
      - { do: serve, who: 予安, kind: cocoa }
      - 德叔: 喝完再想。
        tag: 劇本
      - wait: 2
      - 予安: ……我沒有點這個。
      - 德叔: 我知道。

  yuan5:
    waiting: 予安小姐今天問我，老闆晚上會不會待到打烊。我說不一定。
    needClosingHint: 予安小姐說，今天想等打烊以後再走。
    note: 打烊後：老闆按「打烊」、喝完最後一杯，其他客人都走了，予安還在（D57、D78）
    scene:
      - look: 予安
      - 予安: 老闆，打烊了，我可以再待一下嗎？
      - 予安: 我想把稿子念給你聽。只念一小段。
      - choice: listen
        options:
          - listen: 好，你念。
      - { do: pose, who: 予安, pose: read }
      - { do: cat, who: 予安, lap: false }
      - { do: read, doc: manuscript }
      - 予安: ……龍眼睡著了。我念得那麼無聊嗎。
      - 予安: 謝謝你聽完。
      - { do: pose, who: 予安, pose: type }
      - wait: 1.5
      - leave: 予安

  yuan6:
    waiting: 予安小姐今天抱著一個牛皮紙袋來，一直沒打開。她說要等老闆在。
    scene:
      - look: 予安
      - 予安: 老闆，書印好了。
      - { do: pose, who: 予安, pose: book }
      - 予安: 第一本，想先給這間店。
      - { do: read, doc: dedication }
      - 德叔: 這本，我先收進倉庫。老闆想擺在書架上，就擺在書架上。
      - { do: pose, who: 予安, pose: type }
