# 林予安（卡稿的作家）
# segments：來訪段落（陌生 → 點單寒暄 → 閒聊 → 說出身世 → 請咖啡；src/visits.js 排程）
# milestones：六個里程碑的演出（scene）、營業日誌（journal）、想等老闆在的提示（waiting）；條件與順序在 src/story.js
# 這一版全部【待定】（沒寫 tag）。寫法見 docs/劇本格式.md

segments:
  - id: yuan-v1
    note: 第 1 次｜陌生（與 yuan1 同天）
    who: yuan
    kind: with
    with: yuan1
    steps:
      - when: peeked
        steps:
          - 德叔: 昨天在門口站很久的那位，進來了。
      - when: not peeked
        steps:
          - 德叔: 窗邊，來了一位小姐。
      - deshuTo: 予安
      - 德叔: 要什麼，慢慢看。
      - 予安: ……黑咖啡。
      - 德叔: 熱的？
      - 予安: 嗯。
      - deshuHome
      - { do: serve, who: 予安, kind: hot }
      - deshuHome
      - { do: pose, who: 予安, pose: type }
      - look: 予安
      - 旁白: 筆電從袋子裡拿出來，杯子被推到桌角。螢幕的光打在她臉上。
      - 德叔: 黑板，她只看了一眼。
      - wait: 3
      - 予安: ……不對。
        note: 小聲，對著螢幕
      - choice: vYuan1Note
        options:
          - writing: 她在寫東西？
            then:
              - 德叔: 打字。打一下，停一下。
          - quiet: 我們小聲一點。
            then:
              - 德叔: 嗯。
      - wait: 4
      - look: 予安
      - 旁白: 窗邊的桌上，筆電開著。杯子放在手邊，一直沒動。
      - 德叔: 窗邊那位小姐，從開門就坐在那裡。
      - 德叔: 她把同一句話刪了三次。
      - when: catSill
        steps:
          - { do: catMove, kind: roll }
          - 德叔: 龍眼翻了個身。她沒抬頭。
      - choice: vYuan1Stay
        options:
          - stay: 讓她坐到打烊吧。
      - 德叔: 打烊前，燈都亮著。

  - id: yuan-v2
    note: 第 2 次｜點單寒暄（yuan1 之後、yuan2 之前）
    who: yuan
    kind: visit
    after: 1
    before: 2
    steps:
      - look: 予安
      - 旁白: 還是窗邊那張桌。袋子放在對面的椅子上，筆電先沒開。
      - 德叔: 又是窗邊。
      - deshuTo: 予安
      - 德叔: 一樣？
      - 予安: 嗯。一樣。
      - { do: serve, who: 予安, kind: hot }
      - 德叔: 那位是老闆。
      - choice: vYuan2Hello
        options:
          - hello: 你好，慢慢坐。
            then:
              - when: not met
                steps:
                  - 予安: ……啊，你好。我叫予安，常坐在這裡寫稿。
                    note: 和 _shared 的 intro 同一句；舊存檔已經聽過就不再說
                  - { do: mark, flag: metYuan }
              - 你: 想坐多久都可以。
              - 予安: ……那我打字小聲一點。
          - nod: （點點頭）
            then:
              - 予安: ……你好。
              - 德叔: 兩邊都點了頭。可以了。
      - deshuHome
      - { do: pose, who: 予安, pose: type }
      - wait: 5
      - 予安: 這句我又刪掉了。
      - 旁白: 退格鍵按住不放，聲音連成一條。
      - 德叔: 又回到空的。
      - wait: 4
      - { do: serve, who: 予安, kind: hot }
      - { do: mark, early: d2-refill }
      - 予安: 謝謝。
      - 予安: 窗外那片山，今天的顏色很好看。
      - choice: vYuan2Hill
        options:
          - later: 晚一點會更好看。
            note: 不說「下午」：多半下班後進店，夜裡也成立
            then:
              - 予安: ……那我再坐一下。
          - look: （一起看一下窗外）
            then:
              - look: 窗外
              - wait: 3
              - 予安: 山上有一塊，顏色比較深。
      - deshuHome
      - 德叔: 山的事，是她先說的。

  - id: yuan-v3
    note: 第 3 次｜閒聊的開始（與 yuan2 借筆同天）
    who: yuan
    kind: with
    with: yuan2
    steps:
      - look: 予安
      - 旁白: 她進門先看了窗邊一眼。位子空著，才把袋子放下。
      - deshuTo: 予安
      - 德叔: 黑的。
      - 予安: 嗯。謝謝德叔。
      - { do: serve, who: 予安, kind: hot }
      - deshuHome
      - { do: pose, who: 予安, pose: type }
      - wait: 6
      - look: 予安
      - 旁白: 筆電的螢幕黑了。她按了兩下電源鍵，沒反應。
      - 予安: 啊……筆電沒電了。
      - choice: vYuan3Plug
        options:
          - plug: 吧台那邊有插座嗎？
            then:
              - 德叔: 插座在吧台底下。線，拉不到窗邊。
          - glance: （看向德叔）
            then:
              - glance: 德叔
              - 德叔: 嗯。
      - 予安: 德叔，可以跟你借一支筆嗎？
      - deshuTo: 予安
      - { do: pose, who: 予安, pose: napkin }
      - deshuHome
      - 德叔: 筆是我的。紙巾是她自己抽的。
      - wait: 3
      - 予安: 奇怪，寫在紙巾上反而寫得出來。
      - choice: vYuan3Napkin
        options:
          - more: 那就多拿幾張。
            then:
              - 予安: ……我會寫很小。
          - fine: 寫得出來就好。
            then:
              - 予安: 嗯。先不要問我為什麼。
      - wait: 2
      - 旁白: 她寫到一半停下來，筆懸著，又繼續。
      - 予安: 這張……可以留在店裡嗎？
      - 德叔: 那張紙巾，她說要留給店裡。我收在倉庫，老闆想擺就擺。
      - 予安: 筆……我先不還。打烊再還。
      - 德叔: 吧台還有一盒。

  - id: yuan-r2
    note: yuan2 沒有演到擴寫版（離線、或老闆站著）：之後第一次見到她時的接回（取代第 3 次）
    who: yuan
    kind: reconnect
    of: yuan2
    after: 2
    before: 3
    steps:
      - look: 予安
      - 旁白: 她今天坐得比平常久，杯子早就空了。
      - 德叔: 紙巾那張，在倉庫。
      - 予安: 那天寫的，打進去以後，又改了。

  - id: yuan-v4
    note: 第 4 次｜閒聊（問她才答，說到一半停住；yuan2 之後、yuan3 之前）
    who: yuan
    kind: visit
    after: 2
    before: 3
    steps:
      - look: 予安
      - 旁白: 打字的聲音沒停過。杯子推到桌角，一半沒喝。
      - 德叔: 今天沒聽到退格鍵。
      - choice: vYuan4Ask
        options:
          - ask: 德叔，她在寫什麼？
            then:
              - 德叔: 沒問過。
          - leave: 那就別打擾她。
            then:
              - 德叔: 嗯。
      - wait: 5
      - 予安: 德叔，可以再一杯嗎？
      - 德叔: 黑的。
      - { do: serve, who: 予安, kind: hot }
      - 予安: 謝謝。
      - choice: vYuan4Write
        options:
          - going: 今天寫得順嗎？
            then:
              - 予安: ……多了一頁。
              - 予安: 明天看，大概又不行。
          - bright: 窗邊會不會太亮？
            then:
              - 予安: 剛好。太暗會想睡。
              - 予安: ……不對，這句收回。店裡不悶。
      - deshuHome
      - 旁白: 門外的路很靜，車很少。路兩邊的樹，一棵接一棵排過去。
      - look: 窗外
      - wait: 4
      - 你: 這條路兩邊，都是龍眼樹。
      - look: 予安
      - 予安: 我阿公以前也在這條路上烤龍眼。
      - choice: vYuan4Longan
        options:
          - roast: 烤龍眼？
            then:
              - 予安: ……嗯。很久以前的事。
          - wait: （等她說下去）
            then:
              - wait: 3
              - 予安: ……沒事。我先寫。
      - { do: pose, who: 予安, pose: type }
      - 德叔: 手又放回鍵盤上了。
      - wait: 4
      - 予安: ……這段，先不刪。
      - when: catSill
        steps:
          - { do: catMove, kind: roll }
          - 旁白: 窗台上的龍眼翻了個身，尾巴垂下來。

  - id: yuan-v5
    note: 第 5 次｜閒聊（yuan3 前一次）
    who: yuan
    kind: visit
    after: 2
    before: 3
    steps:
      - look: 予安
      - 旁白: 她把寫過的紙收起來，沒讓人看見寫了什麼。
      - { do: serve, who: 予安, kind: hot }
      - 德叔: 第二杯。
        note: 她不回「謝謝」，埋著頭
      - deshuHome
      - wait: 3
      - 予安: 打進去，就不是那句了。
        note: 看著紙巾，又看筆電
      - choice: vYuan5Napkin
        options:
          - napkin: 那就先寫在紙巾上。
            then:
              - 予安: ……德叔，紙巾再一包。
              - 德叔: 在你手邊。
          - nod: （點點頭）
            then:
              - 予安: ……你不覺得奇怪就好。
      - 德叔: 門一響，她就抬頭。

  - id: yuan-v6
    note: 第 6 次｜yuan3：說出龍眼窯，再自然問第一杯
    who: yuan
    kind: with
    with: yuan3
    steps:
      - look: 予安
      - 旁白: 她把筆電闔上一半，手還放在上面。
      - 予安: 老闆，我好像一直沒說過我在寫什麼。
      - 予安: 我在寫我阿公的龍眼窯。
      - 予安: 窯熄了以後，阿公就很少說話了。我想把那個煙寫回來。
      - wait: 2
      - 旁白: 杯子空了。她沒有再打開筆電。
    invite:
      drink: black
      options:
        - treat: 再一杯黑咖啡？我請。
          then:
            - 予安: ……好。
        - later: 慢慢寫。
          then:
            - 予安: ……嗯。今天說得夠多了。
      missing:
        # 黑板上沒有黑咖啡時；只陳述，接著的選杯標題才問
        - 予安: ……好。
        - 德叔: 黑板上，今天沒有黑咖啡。

  - id: yuan-r3
    note: yuan3 已經發生、結尾的第一杯沒有問到：之後第一次見到她時只補那個邀請（選項與分支就是 yuan-v6 的 invite）
    who: yuan
    kind: reconnect
    of: yuan3
    uninvited: true
    after: 3
    before: 4
    steps:
      - look: 予安
      - 旁白: 她先把杯子挪開，才把筆電放上桌。
    invite: yuan-v6

