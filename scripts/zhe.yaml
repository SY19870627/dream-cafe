# 陳柏哲（阿哲，返鄉青農）
# segments：來訪段落（src/visits.js 排程）；milestones：六個里程碑的演出、日誌、提示（條件與順序在 src/story.js）
# 這一版全部【待定】（沒寫 tag）。寫法見 docs/劇本格式.md

segments:
  - id: zhe-v1
    note: 第 1 次｜陌生（與 zhe1 同天）
    who: zhe
    kind: with
    with: zhe1
    steps:
      - { do: prop, prop: longanBag }
      - 旁白: 一袋龍眼乾擱在吧台上。送來的人站著，沒打算坐。
      - 阿哲: 我阿公說新店開張要送東西。我是被逼來的。
      - 德叔: 替我謝謝阿公。
      - 阿哲: 窯烤的，配咖啡剛好。不是我說的，是我阿公說的。
      - 德叔: 隔壁龍眼園的。
        note: 對老闆，小聲
      - 阿哲: 欸，我站在這裡喔。
      - choice: vZhe1Thanks
        options:
          - thanks: 謝謝你的龍眼乾。
            then:
              - 阿哲: 謝我阿公啦，我只負責提……
              - 阿哲: ……翻篩也是我啦。好啦。
          - nod: （點點頭）
            then:
              - 阿哲: 蛤，就這樣？……好啦，德叔也這樣。
      - 阿哲: 袋子開了要夾起來喔。這裡一潮就軟掉。
      - 德叔: 嗯。

  - id: zhe-v2
    note: 第 2 次｜點單寒暄（zhe1 之後、zhe2 之前）
    who: zhe
    kind: visit
    after: 1
    before: 2
    steps:
      - 旁白: 門口的腳踏墊上印了兩個泥腳印，一路到吧台前面。
      - look: 阿哲
      - 阿哲: 我阿公叫我來看看你們缺什麼。我是被逼來的。
      - 德叔: 不缺。水先喝。
        note: 阿哲沒有坐姿的圖，站著
      - 阿哲: 老闆以前坐辦公室的喔？背這麼直。
      - choice: vZhe2Office
        options:
          - obvious: 這麼明顯？
            then:
              - 阿哲: 超明顯。我們這邊的人，椅子坐一半就夠了。
          - was: 以前是。
            then:
              - 阿哲: 以前喔。……那現在是老闆了。很好啊。
      - 德叔: 阿哲，鞋。
      - 阿哲: 蛤？……啊。歹勢，早上才從園裡出來。
      - choice: vZhe2Mud
        options:
          - fine: 沒關係，店裡不怕泥。
            then:
              - 阿哲: 聽到沒德叔，老闆說不怕。
              - 德叔: 墊子怕。
          - smile: （笑一下）
            then:
              - { do: laugh, who: [阿哲] }
      - 德叔: 墊子晚一點拍。

  - id: zhe-v3
    note: 第 3 次｜閒聊
    who: zhe
    kind: visit
    after: 1
    before: 2
    steps:
      - look: 阿哲
      - 旁白: 他靠在吧台邊，一隻手還插在外套口袋裡。
      - 阿哲: 德叔，你們的豆子是哪一區的？……我只是問問。
      - 德叔: 就那片山。
      - 阿哲: 我就說。那個味道，我們曬場也有。
      - choice: vZhe3Beans
        options:
          - farm: 你家也種咖啡？
            then:
              - 阿哲: 有啊。龍眼樹底下種的，阿公的。現在……算我的啦。
          - smell: 聞得出來？
            then:
              - 阿哲: 天天在曬場翻，鼻子會記。
      - 阿哲: 今天果園的龍眼開花了，整片都是蜂。
      - 德叔: 蜂多，好。
      - 阿哲: 阿公也講一樣的。……講到蜂，他才會跟我同一國。
      - choice: vZhe3More
        options:
          - others: 其他的呢？
            then:
              - 阿哲: 其他的喔……今天不要啦。講了我回去會想吵。
          - wait: （等他說下去）
            then:
              - wait: 2
              - 阿哲: ……沒啦。今天講蜂就好。

  - id: zhe-v4
    note: 第 4 次｜zhe2：原句之後說出自己的事，再自然問第一杯
    who: zhe
    kind: with
    with: zhe2
    steps:
      - look: 阿哲
      - 旁白: 他靠在吧台上，手指敲著檯面，話一句接一句。
      - 阿哲: 德叔，我跟你說，我阿公喔，咖啡豆只肯日曬。
      - 阿哲: 我想試蜜處理、試厭氧，他連聽都不聽，說古早就是這樣曬。
      - 德叔: 你阿公曬的豆，我年輕時喝過。
      - 阿哲: 蛤？
      - glance: 德叔
      - 旁白: 敲檯面的手停了。
      - 德叔: 很久了。
      - 阿哲: ……他沒跟我講過這個。
      - look: 阿哲
      - 阿哲: 老闆，我講真的。新的試一批就好，一批。……他聽到「新」就走掉了。
    invite:
      drink: dongshan
      any: true
      need: longan
      options:
        - treat: 喝一杯再回去吧，我請。
          then:
            - 阿哲: 請喔？……那配龍眼乾可以嗎，我阿公那包。
            - 德叔: 有。
        - later: 慢慢來。
          then:
            - 阿哲: ……好啦。我先回去，阿公五點要翻篩。
      missing:
        # 只陳述，接著的選杯標題才問
        - 阿哲: 請喔？……那配龍眼乾可以嗎，我阿公那包。
        - 德叔: 黑板上，今天沒有龍眼乾。

  - id: zhe-r2
    note: zhe2 沒有演到擴寫版：之後第一次見到他時的接回（結尾一樣問第一杯）
    who: zhe
    kind: reconnect
    of: zhe2
    after: 2
    before: 3
    steps:
      - look: 阿哲
      - 旁白: 他進門沒先打招呼，直接走到吧台前面。
      - 阿哲: 德叔，我回去問阿公了。你喝過他的豆那件事。
      - 阿哲: 他講「喔」。然後就去翻篩了。
        note: 之後寫阿公時，以「阿哲問過、阿公沒正面答」為底
      - 德叔: 嗯。
      - 阿哲: 你跟他講話，都一樣省。
    invite: zhe-v4

milestones:
