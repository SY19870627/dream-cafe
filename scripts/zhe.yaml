  zhe3:
    waiting: 晚上風很大。阿哲進來看了一眼天，說樹要先綁一綁，就走了。
    note: 颱風夜：天色暗下來、風雨聲，阿哲全身是泥衝進店裡；德叔沒說話，遞毛巾與咖啡
    scene:
      - look: 窗外
      - { do: weather, weather: typhoon }
      - 旁白: 雨打在玻璃上，一陣一陣。窗外的樹全往同一邊彎。
      - wait: 3
      - glance: 德叔
      - wait: 1.5
      - { do: enter, who: 阿哲, at: bar, pose: muddy, fast: true }
      - look: 阿哲
      - 旁白: 他從頭濕到腳。泥水從褲管滴下來，在吧台前積成一小灘。
      - 阿哲: ……德叔。
      - deshuTo: 阿哲
      - { do: pose, who: 阿哲, pose: towel }
      - deshuHome
      - { do: serve, who: 阿哲, kind: hot }
      - wait: 1.5
      - 阿哲: 阿公種了四十年的樹，一個晚上就……
        note: 停住，沒說完
      - wait: 5

  zhe4:
    journal:
      - 阿哲帶阿公來了。阿公坐角落，阿哲站在旁邊。端了一杯店裡的東山豆過去。
      - text: 阿公說：「這是阮的豆仔。」
        note: 台語，Q13
      - 祖孫兩個同時笑出來。他們一起笑，我是第一次看到。
    scene:
      - { do: enter, who: 阿公, at: corner, pose: stand, async: true }
      - { do: enter, who: 阿哲, at: cornerSide, pose: stand }
      - arrived: 阿公
      - { do: pose, who: 阿公, pose: sit }
      - look: 阿公
      - 旁白: 阿公把斗笠放在腿上，拐杖靠著桌腳。阿哲站在旁邊，沒坐。
      - { do: serve, who: 阿公, kind: hot }
      - { do: deshuHome, async: true }
      - wait: 2.5
      - 阿公: 這是阮的豆仔。
      - { do: laugh, who: [阿哲, 阿公] }
      - wait: 2

  zhe5:
    waiting: 阿哲帶了兩包豆子來，放在吧台上沒拆。他說要等老闆在。
    scene:
      - look: 阿哲
      - 旁白: 兩包豆子並排放在吧台上，一包鼓一點，一包扁一點。
      - 阿哲: 德叔，老闆。這兩包，我自己弄的。第一批。
      - 阿哲: 左邊照阿公的，日曬。右邊我的。……先喝，先不要講。
      - brewTaste
      - glance: 德叔
      - 德叔: 兩種都好。你阿公的是以前，你的是以後。
      - { do: laugh, who: [阿哲] }

  zhe6:
    journal:
      - 菜單上多了一杯「阿哲的豆」。
      - 阿哲看了很久，說：「你確定要寫我的名字？……好啦，寫大一點。」
    scene:
      - 旁白: 菜單本攤在吧台上，翻到空的那一頁。
      - 德叔: 阿哲。菜單，加你的豆。
      - 阿哲: 你確定要寫我的名字？……好啦，寫大一點。
      - menu
