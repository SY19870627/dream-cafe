      - 阿哲: 我阿公說新店開張要送東西。我是被逼來的。
      - 德叔: 替我謝謝阿公。
      - 阿哲: 窯烤的，配咖啡剛好。不是我說的，是我阿公說的。

  zhe2:
    journal:
      - 阿哲站在吧台前面講他阿公，說咖啡豆只肯日曬，新的方法一句都不聽。
      - text: 我跟他說，他阿公曬的豆，我年輕時喝過。
        note: 劇本台詞改成日誌的口吻
      - 他說：「蛤？」
    scene:
      - look: 阿哲
      - 旁白: 他靠在吧台上，手指敲著檯面，話一句接一句。
      - 阿哲: 德叔，我跟你說，我阿公喔，咖啡豆只肯日曬。
      - 阿哲: 我想試蜜處理、試厭氧，他連聽都不聽，說古早就是這樣曬。
      - 德叔: 你阿公曬的豆，我年輕時喝過。
      - 阿哲: 蛤？
      - glance: 德叔
