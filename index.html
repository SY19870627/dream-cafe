<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>我單方面辭退老闆後，開了一間夢想中的咖啡店｜測試版</title>
<style>
  :root { --ink: #3b2a20; --paper: #f6efe2; --accent: #c4382c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--ink); }
  /* 手機直立：在寬螢幕上也維持直式比例 */
  #app { position: relative; height: 100%; max-width: calc(100vh * 9 / 19.5); margin: 0 auto; overflow: clip; touch-action: none; }
  #labels { position: absolute; inset: 0; overflow: clip; pointer-events: none; }
  #labels .seat-label { pointer-events: auto; }
  #app canvas { display: block; }
  .top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .title { background: rgba(246,239,226,.92); padding: 6px 12px; border-radius: 14px; font-size: 13px; line-height: 1.35; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .title b { display: block; font-size: 14px; }
  .top-right { display: flex; gap: 8px; align-items: center; }
  .temp { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 14px; font-weight: 700; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  /* 溫度上升時輕輕亮一下 */
  .temp.rise { animation: rise 2.6s ease-out; }
  @keyframes rise { 0% { transform: scale(1); box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    20% { transform: scale(1.12); box-shadow: 0 0 0 6px rgba(255,190,110,.55), 0 2px 12px rgba(0,0,0,.25); }
    100% { transform: scale(1); box-shadow: 0 2px 8px rgba(0,0,0,.2); } }
  #menu-btn { pointer-events: auto; width: 44px; height: 44px; padding: 0; border-radius: 14px; font-size: 22px; line-height: 44px; }
  .bottom { position: absolute; left: 12px; right: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
  .hint { align-self: center; background: rgba(30,22,16,.72); color: #f6efe2; padding: 6px 12px; border-radius: 12px; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1 1 auto; white-space: nowrap; padding-left: 8px; padding-right: 8px; } /* 窄欄（桌機上約 330px）也不換行 */
  /* 手機點擊目標至少 44px */
  button { font: inherit; border: 0; border-radius: 14px; padding: 12px 10px; font-size: 15px; font-weight: 600; min-height: 48px; min-width: 44px;
    background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  button:disabled { opacity: .5; }
  button.primary { background: var(--ink); color: var(--paper); }
  [hidden] { display: none !important; }
  #speed { position: absolute; top: 68px; right: 12px; min-height: 44px; padding: 8px 12px; font-size: 13px; border-radius: 12px; opacity: .85; }
  #labels .seat-label { position: absolute; left: 0; top: 0; min-height: 44px; padding: 10px 14px; font-size: 15px; border-radius: 14px;
    background: rgba(246,239,226,.95); border: 2px solid var(--ink); white-space: nowrap; }
  /* 關於面板：蓋在畫面上，點外面關閉 */
  #about { position: absolute; inset: 0; background: rgba(20,14,10,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  #about .card { width: 100%; max-width: 320px; background: var(--paper); border-radius: 18px; padding: 20px 18px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #about h2 { margin: 0 0 4px; font-size: 17px; line-height: 1.4; }
  #about .sub { margin: 0 0 14px; font-size: 13px; opacity: .75; }
  #about dl { margin: 0 0 14px; font-size: 15px; }
  #about dt { font-size: 12px; opacity: .7; margin-top: 6px; }
  #about dd { margin: 0; }
  #about .links { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  #about .links a { display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #fff;
    border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; }
  #about .links a span { margin-left: auto; font-weight: 400; font-size: 13px; opacity: .7; }
  #about-close, .wide { width: 100%; }
  #open-notebook { margin-bottom: 14px; }
  #dev-tools { border-top: 1px dashed rgba(59,42,32,.4); padding-top: 10px; margin-bottom: 12px; }
  #dev-tools .sub { margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid button { font-size: 14px; padding: 8px; }
  /* 佈置鈕：溫度基金撥款時輕輕亮一下 */
  #place.rise { animation: rise 2.6s ease-out; }
  /* 店的記事本 */
  .overlay { position: absolute; inset: 0; background: rgba(20,14,10,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 11; }
  .overlay .card { width: 100%; max-width: 340px; max-height: calc(100% - 20px); display: flex; flex-direction: column; background: var(--paper);
    border-radius: 18px; padding: 20px 18px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .overlay h2 { margin: 0 0 6px; font-size: 18px; }
  .overlay .sub { margin: 0 0 6px; font-size: 13px; opacity: .8; }
  .card.paper { background: #fbf5e6 repeating-linear-gradient(#fbf5e6 0 27px, #eadfc8 27px 28px); }
  #nb-list { list-style: none; margin: 8px 0 14px; padding: 0; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  #nb-list li { padding: 8px 2px; border-bottom: 1px dashed rgba(59,42,32,.3); display: flex; flex-direction: column; gap: 2px; }
  #nb-list small { font-size: 12px; opacity: .65; }
  #nb-list b { font-size: 15px; }
  #nb-list span { font-size: 13px; opacity: .8; }
  .nb-empty { font-size: 14px; margin: 12px 0 16px; }
  /* 德叔的型錄／倉庫 */
  #sheet { position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20,14,10,.25); }
  #sheet .card { background: var(--paper); border-radius: 18px 18px 0 0; padding: 14px 14px 10px; max-height: 64%; display: flex; flex-direction: column;
    box-shadow: 0 -6px 24px rgba(0,0,0,.3); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  #sheet-close { width: 44px; min-height: 44px; padding: 0; font-size: 18px; }
  #sheet .sub { margin: 6px 0 8px; font-size: 13px; opacity: .8; line-height: 1.45; }
  #sheet-list { overflow-y: auto; flex: 1 1 auto; min-height: 0; touch-action: pan-y; }
  #sheet-list h3 { margin: 10px 0 4px; font-size: 13px; opacity: .65; font-weight: 600; }
  .sheet-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(59,42,32,.12); }
  .sheet-row img { width: 56px; height: 56px; flex: none; background: #efe4cf; border-radius: 10px; }
  .sheet-row .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .sheet-row .info b { font-size: 15px; }
  .sheet-row .info span { font-size: 12.5px; opacity: .78; }
  .sheet-row .info small { font-size: 12.5px; color: #7a4a2c; }
  .sheet-row button { flex: none; min-width: 72px; }
  #bubble { position: absolute; left: 0; top: 0; max-width: 220px; background: #fffaf0; border: 2px solid var(--ink);
    border-radius: 14px; padding: 8px 12px; font-size: 14px; line-height: 1.4; pointer-events: none;
    opacity: 0; transition: opacity .3s; }
  #bubble.show { opacity: 1; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -8px; border: 8px solid transparent;
    border-top-color: var(--ink); border-bottom: 0; }
  /* ---------- 階段 3：開場、營業日誌、老先生的信 ---------- */
  :root { --hand: "Kaiti TC", "STKaiti", "BiauKai", "DFKai-SB", "標楷體", "KaiTi", "AR PL UKai TW", serif; }
  #opening { position: absolute; inset: 0; z-index: 20; background: #15171c; color: #f1ece2; overflow: hidden; transition: opacity .9s; }
  #opening.fade { opacity: 0; pointer-events: none; }
  .op-stage { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 18px 18px; gap: 12px; overflow-y: auto;
    opacity: 0; transition: opacity .7s; touch-action: pan-y; }
  .op-stage.on { opacity: 1; }
  #op-skip { position: absolute; top: 12px; right: 12px; z-index: 2; min-height: 44px; padding: 8px 16px; font-size: 14px;
    background: rgba(246,239,226,.16); color: #f1ece2; box-shadow: none; border: 1px solid rgba(246,239,226,.35); }
  .op-caption { margin: 0; font-size: 15px; line-height: 1.7; opacity: .9; text-align: center; }
  /* 第一幕：16:49 的辦公室 */
  .op-office { background: linear-gradient(#2c3340, #1b1f27 70%); }
  .op-clock { position: absolute; top: 14px; left: 18px; font: 600 26px/44px ui-monospace, "Consolas", monospace; letter-spacing: 2px; color: #ffcf8a; }
  .op-clock.flip { animation: flip .6s ease-out; }
  @keyframes flip { 0% { transform: scaleY(1); } 45% { transform: scaleY(.1); } 100% { transform: scaleY(1); } }
  .op-monitor { background: #0f1218; border: 10px solid #3d4350; border-radius: 12px; box-shadow: 0 0 40px rgba(120,160,220,.15); flex: none; }
  .op-mail { background: #f5f6f8; color: #2b2f36; padding: 12px 14px; font-size: 14.5px; line-height: 1.6; border-radius: 2px; }
  .op-mail-head { display: flex; flex-direction: column; font-size: 12.5px; color: #5f6672; border-bottom: 1px solid #d6d9de; padding-bottom: 6px; margin-bottom: 6px; }
  .op-mail p { margin: 0 0 4px; }
  .op-ending { min-height: 1.6em; font-weight: 600; color: #1f3f6e; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: #2b2f36; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .op-sign { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 14px; margin-top: 4px; }
  .op-sign input { font: inherit; font-size: 16px; width: 9em; min-height: 44px; padding: 6px 10px; border: 1px solid #b9bec7; border-radius: 8px; background: #fff; color: #2b2f36; }
  .op-q { margin: 2px 0 0; font-size: 14px; opacity: .8; }
  .op-choices { display: flex; flex-direction: column; gap: 8px; }
  .op-choices button { text-align: left; background: rgba(246,239,226,.1); color: #f1ece2; border: 1px solid rgba(246,239,226,.35); box-shadow: none; font-weight: 500; }
  .op-choices button[aria-pressed="true"] { background: #f1ece2; color: #1b1f27; border-color: #f1ece2; }
  .op-keys { font-size: 13px; opacity: .5; text-align: center; letter-spacing: 3px; animation: keys 2.4s ease-in-out infinite; }
  @keyframes keys { 0%, 100% { opacity: .2; } 50% { opacity: .6; } }
  .op-stage button.primary { background: #f1ece2; color: #1b1f27; flex: none; }
  /* 標題 */
  .op-title { background: #0b0c0f; justify-content: center; align-items: center; text-align: center; }
  .op-title h1 { margin: 0 0 6px; font-size: 25px; line-height: 1.5; font-weight: 700; letter-spacing: 1px; animation: floatin 2.4s ease-out both; }
  .op-title .sub { margin: 0 0 28px; font-size: 13px; opacity: .65; animation: floatin 2.4s .6s ease-out both; }
  .op-title button.primary { min-width: 160px; animation: floatin 2s 1.2s ease-out both; }
  @keyframes floatin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .op-credit { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 2px; font-size: 12px; opacity: .6; }
  .op-credit a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 8px; color: inherit; }
  /* 第二幕：信箱與律師信 */
  .op-mailbox { background: #23262d; }
  .op-box-btn { padding: 0; background: none; box-shadow: none; border-radius: 12px; overflow: hidden; flex: none; }
  .op-box-btn img { display: block; width: 100%; height: auto; }
  .op-box-btn.shake { animation: shake .22s ease-in-out 5; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.6deg) translateX(-3px); } 75% { transform: rotate(1.6deg) translateX(3px); } }
  .op-lawyer { background: #fbf8f1; color: #2a2622; border-radius: 6px; padding: 18px 16px 14px; font-family: "PMingLiU", "MingLiU", "Songti TC", "Noto Serif TC", serif;
    font-size: 15px; line-height: 1.75; box-shadow: 0 8px 28px rgba(0,0,0,.4); animation: unfold .8s ease-out both; flex: none; }
  .op-lawyer h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 6px; text-align: center; color: #6c5f50; border-bottom: 3px double #b9ab95; padding-bottom: 6px; font-weight: 600; }
  .op-lawyer p { margin: 0 0 8px; }
  .op-lawyer .key { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6c5f50; margin-top: 6px; }
  @keyframes unfold { from { opacity: 0; transform: scaleY(.6) translateY(-20px); } to { opacity: 1; transform: none; } }
  /* 第三幕：175 縣道 */
  .op-road { background: #1f1a22; padding: 0; justify-content: flex-end; }
  .op-road img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; }
  .op-road-ui { position: relative; padding: 40px 18px 18px; display: flex; flex-direction: column; gap: 12px;
    background: linear-gradient(rgba(20,16,22,0), rgba(20,16,22,.78) 45%); }
  /* 進店後的「略過」 */
  #op-skip-shop { position: absolute; top: 68px; left: 12px; min-height: 44px; padding: 8px 14px; font-size: 13px; border-radius: 12px; opacity: .88; }
  /* 營業日誌與信：手寫風的紙 */
  .hand { font-family: var(--hand); }
  #journal .card, #letter .card { max-width: 350px; }
  .jr-scroll, .lt-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; margin: 4px 0 12px; touch-action: pan-y; }
  .jr-day { margin: 10px 0 2px; font-size: 13px; opacity: .7; font-weight: 600; }
  .jr-day:first-child { margin-top: 2px; }
  .jr-list { list-style: none; margin: 0; padding: 0; }
  .jr-list li { font-size: 17px; line-height: 28px; padding-left: 1em; text-indent: -1em; }
  .jr-list li::before { content: "・"; }
  .jr-sum { font-size: 16px; line-height: 28px; margin: 0 0 4px; }
  #letter .card { background: #fbf3df repeating-linear-gradient(#fbf3df 0 31px, #e8d9b9 31px 32px); }
  .lt-scroll p { margin: 0 0 6px; font-size: 18px; line-height: 32px; text-indent: 2em; }
  .lt-scroll p:first-child { text-indent: 0; }
  .lt-scroll i { font-style: normal; display: inline-block; text-indent: 0; } /* 每個字一點點歪：字有點抖 */
  .nb-links { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px; }
  .nb-links button { font-size: 14px; padding: 8px 10px; text-align: left; background: #fff; border: 1px solid rgba(59,42,32,.35); box-shadow: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="title"><b>東山・第一間店</b><span id="day">開店第 1 天</span></div>
    <div class="top-right">
      <div class="temp" id="temp">20.0°C</div>
      <button id="menu-btn" aria-label="選單" aria-controls="about" aria-expanded="false">≡</button>
    </div>
  </div>
  <button id="speed" hidden>正常速度</button>
  <button id="op-skip-shop" hidden>略過開場</button>
  <div id="labels"></div>
  <div id="bubble"></div>
  <div class="bottom">
    <div class="hint" id="hint"></div>
    <div class="row">
      <button id="place">佈置</button>
      <button id="stand">站起來</button>
      <button id="brew" class="primary">請德叔沖一杯</button>
      <button id="p-catalog" hidden>型錄</button>
      <button id="p-store" hidden>倉庫</button>
      <button id="p-putaway" hidden>收起來</button>
      <button id="p-deselect" hidden>放好了</button>
      <button id="p-revert" hidden>復原</button>
      <button id="p-done" class="primary" hidden>確定</button>
      <button id="read-letter" class="primary" hidden>讀信</button>
      <button id="tut-later" hidden>再坐一下</button>
      <button id="tut-place" class="primary" hidden>開始佈置</button>
      <button id="night">白天</button>
    </div>
  </div>
  <div id="about" hidden role="dialog" aria-modal="true" aria-labelledby="about-title">
    <div class="card">
      <h2 id="about-title">我單方面辭退老闆後，開了一間夢想中的咖啡店</h2>
      <p class="sub">測試版・台南東山</p>
      <p class="sub" id="save-note" hidden>這台裝置目前沒辦法存檔（可能是私密瀏覽）。店照常營業，只是關掉後進度不會留下。</p>
      <button id="open-notebook" class="wide">店的記事本</button>
      <dl><dt>開發者</dt><dd>SY</dd></dl>
      <div class="links">
        <a href="https://github.com/SY19870627" target="_blank" rel="noopener">GitHub<span>SY19870627</span></a>
        <a href="https://x.com/nelsonyehfon" target="_blank" rel="noopener">X<span>@nelsonyehfon</span></a>
      </div>
      <div id="dev-tools" hidden>
        <p class="sub" id="dev-day"></p>
        <div class="grid">
          <button id="dev-day1">跳到明天</button>
          <button id="dev-day7">跳 7 天</button>
          <button id="dev-fund">基金 +5,000</button>
          <button id="dev-reset">重置存檔</button>
        </div>
      </div>
      <button id="about-close" class="primary">回到店裡</button>
    </div>
  </div>
  <!-- 店的記事本：只列已經發生的事 -->
  <div id="notebook" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="nb-title">
    <div class="card paper">
      <h2 id="nb-title">店的記事本</h2>
      <p class="sub" id="nb-summary"></p>
      <p class="sub" id="nb-decor"></p>
      <div class="nb-links" id="nb-links"></div>
      <p class="nb-empty" id="nb-empty">還沒有寫下什麼。先坐下來，喝一杯吧。</p>
      <ol id="nb-list"></ol>
      <button id="nb-close" class="primary wide">闔上</button>
    </div>
  </div>
  <!-- 德叔的型錄／倉庫：從下方拉起的面板 -->
  <div id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="card">
      <div class="sheet-head"><h2 id="sheet-title">德叔的型錄</h2><button id="sheet-close" aria-label="關閉">✕</button></div>
      <p class="sub" id="sheet-sub"></p>
      <div id="sheet-list"></div>
    </div>
  </div>
  <!-- 德叔的營業日誌：登入時結算老闆不在的日子 -->
  <div id="journal" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="jr-title">
    <div class="card paper hand">
      <h2 id="jr-title">德叔的營業日誌</h2>
      <p class="sub" id="jr-sub"></p>
      <div class="jr-scroll" id="jr-body"></div>
      <button id="jr-close" class="primary wide">收好</button>
    </div>
  </div>
  <!-- 老先生的信（與律師信） -->
  <div id="letter" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="lt-title">
    <div class="card hand">
      <h2 id="lt-title">第一封信</h2>
      <div class="lt-scroll" id="lt-body"></div>
      <button id="lt-close" class="primary wide">收好</button>
    </div>
  </div>
  <!-- 開場：第一幕到第三幕（新存檔才會出現），由 src/opening.js 建立 -->
  <div id="opening" hidden></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
