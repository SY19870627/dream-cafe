<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2420" />
  <title>夢想咖啡店（第二版雛形）</title>
  <link rel="icon" href="./assets/art/app_icon_192.png" />
  <link rel="stylesheet" href="./src/view/style.css" />
  <!-- 沒有建置步驟：three 由 importmap 對到 vendor 的打包檔 -->
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <div id="app">
    <header id="top">
      <div id="ch-title">序章</div>
      <div id="thermo" title="牆上的老溫度計"><span class="tube"><i id="thermo-fill"></i></span><span id="temp">20.5°C</span></div>
      <button type="button" id="btn-more" aria-label="重新開始">⋯</button>
    </header>
    <p id="goal"></p>
    <div id="stage"></div>
    <p id="status"></p>
    <div id="panel">
      <div id="tray"></div>
      <div id="sel" hidden></div>
      <div id="speed" hidden>
        <div class="sp-row">
          <span id="clock">10:00</span>
          <div class="bar"><i id="progress"></i></div>
        </div>
        <div class="sp-row">
          <button type="button" data-rate="1">1×</button>
          <button type="button" data-rate="2">2×</button>
          <button type="button" data-rate="4">4×</button>
          <button type="button" id="btn-skipday">跳到打烊</button>
        </div>
      </div>
    </div>
    <footer id="actions">
      <button type="button" id="btn-menu">菜單</button>
      <button type="button" id="btn-open" class="primary">開店</button>
    </footer>
    <button type="button" id="intro-skip" hidden>略過開場</button>
  </div>
  <div id="opening" hidden></div>
  <div id="seat" hidden></div>
  <div id="sheet" hidden></div>
  <div id="journal" hidden></div>
  <div id="say" hidden></div>
  <div id="toast" hidden></div>
  <div id="drag-chip" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
