<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b2a20">
<link rel="icon" type="image/png" sizes="192x192" href="assets/art/app_icon_192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/art/app_icon_180.png">
<title>我單方面辭退老闆後，開了一間夢想中的咖啡店｜v3b 三天故事驗證版</title>
<style>
  :root { --ink: #3b2a20; --paper: #f6efe2; --wood: #7a5638; --box-h: 31%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--ink); line-break: strict;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  /* 手機直立：寬螢幕上也維持直式比例 */
  #app { position: relative; height: 100%; max-width: calc(100vh * 9 / 19.5); margin: 0 auto; overflow: hidden; background: #2a1d16; }
  #pano { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* 閱讀時店面只畫在閱讀框上方，吧台和桌上的杯子不會被框蓋住 */
  #pano.reading { height: calc(100% - var(--box-h) + 14px); }
  [hidden] { display: none !important; }
  button { font: inherit; min-height: 44px; min-width: 44px; border-radius: 12px; border: 0; padding: 10px 16px; cursor: pointer;
    background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.25); }

  /* 開場推門後德叔的三句、「先坐。」：沿用 v3a 的說話框與點一下換句 */
  .say { position: absolute; left: 16px; right: 16px; top: 64px; z-index: 6; padding: 12px 16px; border-radius: 16px;
    background: rgba(246,239,226,.95); color: var(--ink); font-size: 16px; line-height: 1.65; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    pointer-events: none; animation: rise .35s ease-out both; }
  .say .who { display: block; font-size: 12px; letter-spacing: 2px; opacity: .6; margin-bottom: 2px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #next { position: absolute; inset: 0; z-index: 7; background: transparent; box-shadow: none; border-radius: 0; }
  #next::after { content: "▸"; position: absolute; right: 22px; bottom: 28px; font-size: 22px; color: #f6efe2; text-shadow: 0 1px 4px rgba(0,0,0,.6);
    animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* ---------- v3b 故事閱讀層（背景、立繪、特寫、名牌、閱讀框、選項） ---------- */
  #story { position: absolute; inset: 0; z-index: 5; overflow: hidden; cursor: pointer; }
  .st-bg { position: absolute; inset: 0; overflow: hidden; }
  .st-bg-in { position: absolute; inset: 0; transition: transform .7s ease; transform-origin: 50% 50%; }
  .st-bg-in.enter { animation: bgin .6s ease-out both; }
  @keyframes bgin { from { opacity: 0; } to { opacity: 1; } }
  .st-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .st-lady { position: absolute; width: auto; transform: translateX(-50%); pointer-events: none; opacity: .95; }
  .st-portrait { position: absolute; inset: 0; pointer-events: none; }
  .st-portrait img { position: absolute; left: 50%; transform: translateX(-50%); width: auto; filter: drop-shadow(0 6px 14px rgba(40,20,10,.35)); }
  .st-portrait img.enter { animation: pin .45s ease-out both; }
  @keyframes pin { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .st-focus { position: absolute; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  .st-card { padding: 10px; border-radius: 8px; background: #fbf5e8; box-shadow: 0 10px 28px rgba(30,15,5,.45);
    border: 1px solid #e2d3b6; animation: rise .4s ease-out both; }
  .st-card img { display: block; width: 100%; height: 100%; object-fit: contain; }
  /* 手機沒有原圖：中性外形，螢幕只有光，不畫訊息（字在閱讀框） */
  .st-phone { position: relative; aspect-ratio: 9 / 18; border-radius: 18px; border: 6px solid #2c2622; box-shadow: 0 10px 28px rgba(0,0,0,.5);
    background: radial-gradient(120% 70% at 50% 30%, #fbf7ee, #d8dfe3 70%, #b9c3c9); animation: rise .4s ease-out both; }
  .st-phone::before { content: ""; position: absolute; top: 6px; left: 50%; width: 26%; height: 4px; border-radius: 2px; background: #2c2622; transform: translateX(-50%); }
  .st-phone.off { background: #141210; }
  .st-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px 14px; background: linear-gradient(rgba(30,20,12,.62), rgba(30,20,12,0)); }
  .st-scene { flex: 1; min-width: 0; font-size: 13px; color: #f6efe2; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-top button { font-size: 15px; padding: 8px 14px; background: rgba(251,245,232,.9); }
  /* 閱讀框：下方約 31%，字多往上長；紙感、木色邊 */
  .st-box { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; min-height: var(--box-h); max-height: 64%; overflow-y: auto;
    padding: 24px 22px calc(22px + env(safe-area-inset-bottom)); background: #fbf5e8;
    background-image: linear-gradient(rgba(122,86,56,.06) 1px, transparent 1px); background-size: 100% 30px;
    border-top: 5px solid var(--wood); box-shadow: 0 -6px 20px rgba(30,15,5,.35); font-size: 19px; line-height: 1.6; }
  .st-line { margin: 0 0 10px; animation: rise .3s ease-out both; }
  .st-line:last-child { margin-bottom: 0; }
  .st-name { display: inline-block; margin: 0 0 4px; padding: 2px 12px; border-radius: 6px; background: var(--wood); color: #fbf5e8;
    font-size: 15px; letter-spacing: 2px; line-height: 1.6; }
  .st-text { display: block; }
  .st-line.narrator .st-text { color: #4b3a2e; }
  .st-tag { font-size: 12px; color: #a08c76; margin-right: 2px; vertical-align: 2px; }
  .st-more { display: block; text-align: right; font-size: 16px; line-height: 1; color: var(--wood); animation: blink 1.4s ease-in-out infinite; }
  .st-box.dim .st-line { opacity: .55; }
  .st-daytitle { margin: 22px 0 8px; text-align: center; font-size: 20px; letter-spacing: 2px; animation: rise .5s ease-out both; }
  .st-choices { position: absolute; left: 16px; right: 16px; z-index: 4; display: flex; flex-direction: column; gap: 12px; cursor: default; }
  .st-choices button { min-height: 56px; font-size: 18px; line-height: 1.5; text-align: left; padding: 12px 18px; background: #fbf5e8;
    border: 2px solid var(--wood); box-shadow: 0 6px 18px rgba(30,15,5,.4); animation: rise .35s ease-out both; }
  /* 環視（店內可選）：故事層收起，只留回到故事與回顧 */
  #look { position: absolute; left: 0; right: 0; top: 0; z-index: 6; display: flex; justify-content: flex-end; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px; pointer-events: none; }
  #look > * { pointer-events: auto; }
  #look .hint { margin-right: auto; align-self: center; font-size: 13px; color: #f6efe2; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
  #look button { font-size: 15px; padding: 8px 14px; background: rgba(251,245,232,.92); }
  /* 回顧：蓋住整個畫面，點不穿 */
  #log { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; background: rgba(28,20,14,.72); cursor: default; }
  .log-paper { flex: 1; margin: calc(12px + env(safe-area-inset-top)) 12px 0; padding: 18px 18px 8px; overflow-y: auto; border-radius: 10px 10px 0 0;
    background: #fbf5e8; font-size: 17px; line-height: 1.6; touch-action: pan-y; }
  .log-item { margin: 0 0 12px; }
  .log-item .st-name { font-size: 13px; padding: 0 8px; margin-right: 6px; }
  .log-day { margin: 18px 0 12px; padding-top: 10px; border-top: 1px dashed #c9b796; font-weight: 600; }
  .log-day:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .log-choice { color: #7a5638; font-weight: 600; }
  .log-bar { display: flex; justify-content: center; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: #fbf5e8; margin: 0 12px; border-top: 1px solid #e2d3b6; }
  .log-bar button { min-width: 160px; background: var(--wood); color: #fbf5e8; }

  #fade { position: absolute; inset: 0; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #boot { position: absolute; inset: 0; z-index: 40; background: #1a1612; }

  /* ---------- 開場（版面沿用第一版 legacy/index.html 的 #opening 樣式） ---------- */
  #opening { position: absolute; inset: 0; z-index: 20; background: #15171c; color: #f1ece2; overflow: hidden; }
  .op-stage { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 18px 18px; gap: 12px; overflow-y: auto;
    opacity: 0; transition: opacity .7s; touch-action: pan-y; }
  .op-stage.on { opacity: 1; }
  .op-caption { margin: 0; font-size: 15px; line-height: 1.7; opacity: .9; text-align: center; }
  .op-office, .op-mailbox.reading { background: url(assets/art/scene_office_night.webp) 50% 100% / cover no-repeat, linear-gradient(#2c3340, #1b1f27 70%); }
  .op-clock { position: absolute; top: 14px; left: 18px; font: 600 26px/44px ui-monospace, "Consolas", monospace; letter-spacing: 2px; color: #ffcf8a; }
  .op-clock.flip { animation: flip .6s ease-out; }
  @keyframes flip { 0% { transform: scaleY(1); } 45% { transform: scaleY(.1); } 100% { transform: scaleY(1); } }
  .op-monitor { background: #0f1218; border: 10px solid #3d4350; border-radius: 12px; box-shadow: 0 0 40px rgba(120,160,220,.15); flex: none; }
  .op-mail { background: #f5f6f8; color: #2b2f36; padding: 12px 14px; font-size: 14.5px; line-height: 1.6; border-radius: 2px; }
  .op-mail-head { display: flex; flex-direction: column; font-size: 12.5px; color: #5f6672; border-bottom: 1px solid #d6d9de; padding-bottom: 6px; margin-bottom: 6px; }
  .op-mail p { margin: 0 0 4px; }
  .op-ending { min-height: 1.6em; font-weight: 600; color: #1f3f6e; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: #2b2f36; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  .op-sign { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 14px; margin-top: 4px; }
  .op-sign input { font: inherit; font-size: 16px; width: 9em; min-height: 44px; padding: 6px 10px; border: 1px solid #b9bec7; border-radius: 8px; background: #fff; color: #2b2f36; user-select: text; -webkit-user-select: text; }
  .op-q { margin: 2px 0 0; font-size: 14px; opacity: .8; }
  .op-choices { display: flex; flex-direction: column; gap: 8px; }
  .op-choices button { text-align: left; background: rgba(246,239,226,.1); color: #f1ece2; border: 1px solid rgba(246,239,226,.35); box-shadow: none; font-weight: 500; }
  .op-choices button[aria-pressed="true"] { background: #f1ece2; color: #1b1f27; border-color: #f1ece2; }
  .op-keys { align-self: center; font-size: 13px; color: #f1ece2; text-align: center; letter-spacing: 3px; padding: 2px 10px; border-radius: 10px;
    background: rgba(15,18,24,.55); animation: keys 2.4s ease-in-out infinite; }
  @keyframes keys { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
  .op-stage button.primary { background: #f1ece2; color: #1b1f27; flex: none; }
  .op-stage button.primary:disabled { opacity: .45; }
  .op-title { background: #0b0c0f; justify-content: center; align-items: center; text-align: center; }
  .op-title h1 { margin: 0 0 6px; font-size: 25px; line-height: 1.5; font-weight: 700; letter-spacing: 1px; animation: floatin 2.4s ease-out both; }
  .op-title .sub { margin: 0 0 28px; font-size: 13px; opacity: .65; animation: floatin 2.4s .6s ease-out both; }
  .op-title button.primary { min-width: 160px; animation: floatin 2s 1.2s ease-out both; }
  @keyframes floatin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .op-credit { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 2px; font-size: 12px; opacity: .6; }
  .op-credit a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 8px; color: inherit; }
  .op-mailbox { background: #23262d; transition: opacity .7s, background .9s; }
  .op-office::before, .op-mailbox::before { content: ""; margin-top: auto; }
  .op-office::after, .op-mailbox::after { content: ""; margin-bottom: auto; }
  .op-box-btn { padding: 0; background: none; box-shadow: none; border-radius: 0; overflow: hidden; flex: none; margin: 0 -18px; }
  .op-box-btn img { display: block; width: 100%; aspect-ratio: 1 / 1; height: auto; max-height: 56vh; object-fit: cover; object-position: 66% 60%; }
  .op-box-btn.shake { animation: shake .22s ease-in-out 5; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.6deg) translateX(-3px); } 75% { transform: rotate(1.6deg) translateX(3px); } }
  .op-lawyer { background: #fbf8f1; color: #2a2622; border: 1px solid #d9ccb3; border-radius: 6px; padding: 18px 16px 14px; font-family: "PMingLiU", "MingLiU", "Songti TC", "Noto Serif TC", serif;
    font-size: 15px; line-height: 1.75; box-shadow: 0 8px 28px rgba(0,0,0,.4); animation: unfold .8s ease-out both; flex: none; transform-origin: 50% 0; }
  .op-lawyer h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 6px; text-align: center; color: #6c5f50; border-bottom: 3px double #b9ab95; padding-bottom: 6px; font-weight: 600; }
  .op-lawyer p { margin: 0 0 8px; }
  .op-lawyer .key { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6c5f50; margin-top: 6px; }
  @keyframes unfold { from { transform: scaleY(.82) translateY(-12px); } to { transform: none; } }
  .op-road { background: #1f1a22; padding: 0; justify-content: flex-end; }
  .op-road-art { position: absolute; inset: 0; width: 100%; height: 100%; font-family: "PingFang TC", "Noto Sans TC", sans-serif; }
  .op-road-ui { position: relative; padding: 40px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    background: linear-gradient(rgba(20,16,22,0), rgba(20,16,22,.78) 45%); }
  /* 拖曳推門 */
  .op-door { width: 150px; height: 190px; border-radius: 6px 6px 0 0; background: #f3dfb8; box-shadow: inset 0 0 30px rgba(255,190,90,.8), 0 0 30px rgba(255,200,120,.35);
    touch-action: none; cursor: grab; outline: none; }
  .op-door-panel { position: relative; width: 100%; height: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(90deg, #6b4528, #7b4f2f);
    transform-origin: 0 50%; transition: transform .5s cubic-bezier(.3,1.4,.5,1); display: flex; align-items: center; justify-content: center;
    border: 3px solid #4a2f1a; }
  .op-door-knob { position: absolute; right: 14px; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #d9a84a; }
  .op-door-text { color: #f6efe2; font-size: 16px; font-weight: 600; letter-spacing: 2px; writing-mode: vertical-rl; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .op-door.nudge .op-door-panel { animation: nudge .5s ease-in-out; }
  @keyframes nudge { 30% { transform: perspective(600px) rotateY(-14deg); } 60% { transform: perspective(600px) rotateY(-4deg); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="pano" aria-label="店內"></canvas>
  <div id="say" class="say" hidden aria-live="polite"></div>
  <button id="next" hidden aria-label="下一句"></button>
  <section id="story" hidden>
    <div class="st-bg" id="st-bg"></div>
    <div class="st-portrait" id="st-portrait"></div>
    <div class="st-focus" id="st-focus"></div>
    <div class="st-top" id="st-top"><span class="st-scene" id="st-scene"></span><button id="st-look" type="button" hidden>環視</button><button id="st-log" type="button">回顧</button></div>
    <div class="st-choices" id="st-choices" hidden></div>
    <div class="st-box" id="st-box" aria-live="polite"></div>
  </section>
  <section id="look" hidden><span class="hint">左右拖曳看看店裡</span><button id="look-back" type="button">回到故事</button><button id="look-log" type="button">回顧</button></section>
  <section id="log" hidden role="dialog" aria-label="回顧"><div class="log-paper" id="log-list"></div><div class="log-bar"><button id="log-close" type="button">回到原頁</button></div></section>
  <section id="opening" hidden></section>
  <div id="fade"></div>
  <div id="boot"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
