<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b2a20">
<link rel="icon" type="image/png" sizes="192x192" href="assets/art/app_icon_192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/art/app_icon_180.png">
<title>我單方面辭退老闆後，開了一間夢想中的咖啡店｜試玩版</title>
<style>
  :root { --ink: #3b2a20; --paper: #f6efe2; --wood: #7a5638; --box-h: 31%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1a1612; overflow: hidden;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--ink); line-break: strict;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  /* 手機直立：寬螢幕上也維持直式比例 */
  #app { position: relative; height: 100%; max-width: calc(100vh * 9 / 19.5); margin: 0 auto; overflow: hidden; background: #2a1d16; }
  [hidden] { display: none !important; }
  button { font: inherit; min-height: 44px; min-width: 44px; border-radius: 12px; border: 0; padding: 10px 16px; cursor: pointer;
    background: var(--paper); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.25); }


  @keyframes blink { 50% { opacity: .3; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- v3b 故事閱讀層（背景、立繪、特寫、名牌、閱讀框、選項） ---------- */
  #story { position: absolute; inset: 0; z-index: 5; overflow: hidden; cursor: pointer; }
  .st-bg { position: absolute; inset: 0; overflow: hidden; }
  .st-bg-in { position: absolute; inset: 0; transition: transform .7s ease; transform-origin: 50% 50%; }
  .st-bg-in.enter { animation: bgin .6s ease-out both; }
  @keyframes bgin { from { opacity: 0; } to { opacity: 1; } }
  .st-bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .st-lady { position: absolute; width: auto; transform: translateX(-50%); pointer-events: none; opacity: .95; }
  .st-portrait { position: absolute; inset: 0; pointer-events: none; }
  .st-portrait img { position: absolute; left: 50%; transform: translateX(-50%); width: auto; filter: drop-shadow(0 6px 14px rgba(40,20,10,.35)); }
  .st-portrait img.enter { animation: pin .45s ease-out both; }
  @keyframes pin { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .st-focus { position: absolute; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
  .st-card { padding: 10px; border-radius: 8px; background: #fbf5e8; box-shadow: 0 10px 28px rgba(30,15,5,.45);
    border: 1px solid #e2d3b6; animation: rise .4s ease-out both; }
  .st-card img { display: block; width: 100%; height: 100%; object-fit: contain; }
  /* 手機沒有原圖：中性外形，螢幕只有光，不畫訊息（字在閱讀框） */
  .st-phone { position: relative; aspect-ratio: 9 / 18; border-radius: 18px; border: 6px solid #2c2622; box-shadow: 0 10px 28px rgba(0,0,0,.5);
    background: radial-gradient(120% 70% at 50% 30%, #fbf7ee, #d8dfe3 70%, #b9c3c9); animation: rise .4s ease-out both; }
  .st-phone::before { content: ""; position: absolute; top: 6px; left: 50%; width: 26%; height: 4px; border-radius: 2px; background: #2c2622; transform: translateX(-50%); }
  .st-phone.off { background: #141210; }
  .st-top { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px 14px; background: linear-gradient(rgba(30,20,12,.62), rgba(30,20,12,0)); }
  .st-scene { flex: 1; min-width: 0; font-size: 13px; color: #f6efe2; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-top button { font-size: 15px; padding: 8px 14px; background: rgba(251,245,232,.9); }
  /* 閱讀框：下方約 31%，字多往上長；紙感、木色邊 */
  .st-box { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; min-height: var(--box-h); max-height: 64%; overflow-y: auto;
    padding: 24px 22px calc(22px + env(safe-area-inset-bottom)); background: #fbf5e8;
    background-image: linear-gradient(rgba(122,86,56,.06) 1px, transparent 1px); background-size: 100% 30px;
    border-top: 5px solid var(--wood); box-shadow: 0 -6px 20px rgba(30,15,5,.35); font-size: 19px; line-height: 1.6; }
  .st-line { margin: 0 0 10px; animation: rise .3s ease-out both; }
  .st-line:last-child { margin-bottom: 0; }
  .st-name { display: inline-block; margin: 0 0 4px; padding: 2px 12px; border-radius: 6px; background: var(--wood); color: #fbf5e8;
    font-size: 15px; letter-spacing: 2px; line-height: 1.6; }
  .st-text { display: block; }
  .st-line.narrator .st-text { color: #4b3a2e; }
  .st-tag { font-size: 12px; color: #a08c76; margin-right: 2px; vertical-align: 2px; }
  .st-more { display: block; text-align: right; font-size: 16px; line-height: 1; color: var(--wood); animation: blink 1.4s ease-in-out infinite; }
  .st-box.dim .st-line { opacity: .55; }
  .st-daytitle { margin: 22px 0 8px; text-align: center; font-size: 20px; letter-spacing: 2px; animation: rise .5s ease-out both; }
  .st-choices { position: absolute; left: 16px; right: 16px; z-index: 4; display: flex; flex-direction: column; gap: 12px; cursor: default; }
  .st-choices button { min-height: 56px; font-size: 18px; line-height: 1.5; text-align: left; padding: 12px 18px; background: #fbf5e8;
    border: 2px solid var(--wood); box-shadow: 0 6px 18px rgba(30,15,5,.4); animation: rise .35s ease-out both; }
  /* 回顧：蓋住整個畫面，點不穿 */
  #log { position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; background: rgba(28,20,14,.72); cursor: default; }
  .log-paper { flex: 1; margin: calc(12px + env(safe-area-inset-top)) 12px 0; padding: 18px 18px 8px; overflow-y: auto; border-radius: 10px 10px 0 0;
    background: #fbf5e8; font-size: 17px; line-height: 1.6; touch-action: pan-y; }
  .log-item { margin: 0 0 12px; }
  .log-item .st-name { font-size: 13px; padding: 0 8px; margin-right: 6px; }
  .log-day { margin: 18px 0 12px; padding-top: 10px; border-top: 1px dashed #c9b796; font-weight: 600; }
  .log-day:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .log-choice { color: #7a5638; font-weight: 600; }
  .log-bar { display: flex; justify-content: center; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: #fbf5e8; margin: 0 12px; border-top: 1px solid #e2d3b6; }
  .log-bar button { min-width: 160px; background: var(--wood); color: #fbf5e8; }

  /* 靜音鍵：右上角、避開瀏海；在回顧（#log）之上、轉場黑幕（#fade）之下 */
  #mute { position: absolute; top: calc(6px + env(safe-area-inset-top)); right: 6px; z-index: 26; width: 44px; height: 44px; padding: 10px; border: 0; border-radius: 22px;
    background: rgba(20,16,12,.32); color: #f1ece2; opacity: .55; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #mute:hover, #mute:focus-visible { opacity: .85; }
  #mute svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #mute .spk { fill: currentColor; }
  #mute .slash { display: none; }
  #mute.off .wave { display: none; }
  #mute.off .slash { display: inline; }
  #fade { position: absolute; inset: 0; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #boot { position: absolute; inset: 0; z-index: 40; background: #1a1612; }

  /* ---------- 開場（版面沿用第一版 legacy/index.html 的 #opening 樣式） ---------- */
  #opening { position: absolute; inset: 0; z-index: 20; background: #15171c; color: #f1ece2; overflow: hidden; }
  .op-stage { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 18px 18px; gap: 12px; overflow-y: auto;
    opacity: 0; transition: opacity .7s; touch-action: pan-y; }
  .op-stage.on { opacity: 1; }
  .op-caption { margin: 0; font-size: 15px; line-height: 1.7; opacity: .9; text-align: center; }
  .op-office, .op-mailbox.reading { background: url(assets/art/scene_office_night.webp) 50% 100% / cover no-repeat, linear-gradient(#2c3340, #1b1f27 70%); }
  .op-clock { position: absolute; top: 14px; left: 18px; font: 600 26px/44px ui-monospace, "Consolas", monospace; letter-spacing: 2px; color: #ffcf8a; }
  .op-clock.flip { animation: flip .6s ease-out; }
  @keyframes flip { 0% { transform: scaleY(1); } 45% { transform: scaleY(.1); } 100% { transform: scaleY(1); } }
  .op-monitor { background: #0f1218; border: 10px solid #3d4350; border-radius: 12px; box-shadow: 0 0 40px rgba(120,160,220,.15); flex: none; }
  .op-mail { background: #f5f6f8; color: #2b2f36; padding: 12px 14px; font-size: 14.5px; line-height: 1.6; border-radius: 2px; }
  .op-mail-head { display: flex; flex-direction: column; font-size: 12.5px; color: #5f6672; border-bottom: 1px solid #d6d9de; padding-bottom: 6px; margin-bottom: 6px; }
  .op-mail p { margin: 0 0 4px; }
  .op-ending { min-height: 1.6em; font-weight: 600; color: #1f3f6e; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: #2b2f36; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  .op-sign { margin: 6px 0 0; text-align: right; font-size: 14.5px; }
  .op-note { margin: 4px 0 0; }
  /* 離職事由欄：固定一句；點一下才打出來，點過才能送出 */
  .op-reason { display: block; width: 100%; margin: 4px 0; padding: 6px 8px; text-align: left; font-size: 14.5px; line-height: 1.6; border-radius: 4px;
    background: #fff; border: 1px dashed #8d9ab0; box-shadow: none; color: #1f3f6e; animation: doorcall 2.2s ease-in-out infinite; }
  .op-reason.filled { border-style: solid; border-color: #c9d0db; animation: none; }
  .op-reason:disabled { opacity: 1; cursor: default; }
  .op-reason-label { color: #2b2f36; font-weight: 400; }
  .op-keys { align-self: center; font-size: 13px; color: #f1ece2; text-align: center; letter-spacing: 3px; padding: 2px 10px; border-radius: 10px;
    background: rgba(15,18,24,.55); animation: keys 2.4s ease-in-out infinite; }
  @keyframes keys { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }
  .op-stage button.primary { background: #f1ece2; color: #1b1f27; flex: none; }
  .op-stage button.primary:disabled { opacity: .45; }
  .op-title { background: #0b0c0f; justify-content: center; align-items: center; text-align: center; }
  .op-title h1 { margin: 0 0 6px; font-size: 25px; line-height: 1.5; font-weight: 700; letter-spacing: 1px; animation: floatin 2.4s ease-out both; }
  .op-title .sub { margin: 0 0 28px; font-size: 13px; opacity: .65; animation: floatin 2.4s .6s ease-out both; }
  /* 標題整塊就是按鈕（沒有按鈕字）：點標題進入下一幕 */
  .op-title .op-title-btn { display: block; padding: 24px 12px; min-height: 44px; color: inherit; cursor: pointer; }
  .op-title .op-title-btn:focus-visible { outline: 1px solid rgba(241,236,226,.4); outline-offset: 4px; }
  @keyframes floatin { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .op-credit { position: absolute; left: 0; right: 0; bottom: calc(6px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; font-size: 12px; opacity: .6; }
  .op-credit-row { display: flex; justify-content: center; align-items: center; gap: 2px; }
  /* 製作人員：標題只留一顆不搶眼的小按鈕，點開跳出名單面板（承峰 2026-11-25） */
  .op-staff-btn { margin-top: -10px; min-height: 44px; padding: 0 12px; font-size: 11.5px; letter-spacing: 1px; color: inherit; background: none; box-shadow: none;
    border: 0; border-radius: 0; text-decoration: underline; text-decoration-color: rgba(241,236,226,.35); text-underline-offset: 3px; cursor: pointer; flex: none; }
  .op-staff-btn:focus-visible { outline: 1px solid rgba(241,236,226,.5); outline-offset: 2px; }
  .op-staff-dlg { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
    background: rgba(5,6,8,.72); animation: dlgin .25s ease-out both; }
  .op-staff-dlg[hidden] { display: none; }
  @keyframes dlgin { from { opacity: 0; } to { opacity: 1; } }
  .op-staff-card { position: relative; width: min(340px, 100%); max-height: min(78vh, 560px); overflow-y: auto; overscroll-behavior: contain;
    padding: 34px 20px 20px; border-radius: 10px; background: #16181d; border: 1px solid rgba(241,236,226,.14); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .op-staff-x { position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; padding: 0; font-size: 22px; line-height: 1; color: #f1ece2; opacity: .7;
    background: none; box-shadow: none; border: 0; cursor: pointer; }
  .op-staff-x:hover, .op-staff-x:focus-visible { opacity: 1; }
  .op-staff { text-align: center; font-size: 13px; line-height: 1.75; letter-spacing: .3px; color: rgba(241,236,226,.88); }
  .op-staff p { margin: 0; }
  .op-staff .op-credit-note { margin-top: 10px; font-size: 11px; opacity: .7; }
  .op-credit a { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; justify-content: center; padding: 0 8px; color: inherit; }
  .op-mailbox { background: #23262d; transition: opacity .7s, background .9s; }
  .op-office::before, .op-mailbox::before { content: ""; margin-top: auto; }
  .op-office::after, .op-mailbox::after { content: ""; margin-bottom: auto; }
  .op-box-btn { padding: 0; background: none; box-shadow: none; border-radius: 0; overflow: hidden; flex: none; margin: 0 -18px; }
  .op-box-btn img { display: block; width: 100%; aspect-ratio: 1 / 1; height: auto; max-height: 56vh; object-fit: cover; object-position: 66% 60%; }
  .op-box-btn { position: relative; }
  .op-box-label { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px;
    border-radius: 22px; background: rgba(241,236,226,.94); color: #1b1f27; font-weight: 600; letter-spacing: 2px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .op-box-btn:disabled .op-box-label { opacity: 0; transition: opacity .4s; }
  .op-box-btn.shake { animation: shake .22s ease-in-out 5; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-1.6deg) translateX(-3px); } 75% { transform: rotate(1.6deg) translateX(3px); } }
  .op-letter { background: #fbf8f1; color: #2a2622; border: 1px solid #d9ccb3; border-radius: 6px; padding: 18px 18px 12px; font-family: "PMingLiU", "MingLiU", "Songti TC", "Noto Serif TC", serif;
    font-size: 15px; line-height: 1.75; box-shadow: 0 8px 28px rgba(0,0,0,.4); animation: unfold .8s ease-out both; flex: none; transform-origin: 50% 0; }
  .op-letter h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 8px; text-align: center; color: #6c5f50; border-bottom: 3px double #b9ab95; padding-bottom: 6px; font-weight: 600; }
  .op-letter p { margin: 0 0 6px; }
  .op-letter p.indent { text-indent: 2em; }
  .op-letter p.op-letter-close { margin-top: 10px; }
  .op-letter-sign { text-align: right; }
  .op-attach { display: flex; align-items: center; gap: 8px; margin: 6px -6px 0; padding: 4px 8px; font-size: 13px; color: #6c5f50; background: none; box-shadow: none;
    border-top: 1px dashed #d9ccb3; border-radius: 0 0 6px 6px; width: calc(100% + 12px); font-family: inherit; }
  .op-attach:active { background: rgba(138,109,59,.08); }
  .op-after { margin-top: 2px; }
  .op-keyshot { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center; background: rgba(12,10,9,.72); cursor: pointer; }
  /* 鑰匙從信封滑出的特寫：畫師原圖 prop_v3b_envelope_key_v2（1024×640）照原樣顯示，只疊一點往右下滑的動畫 */
  .op-keyshot-in { position: relative; width: 92%; aspect-ratio: 1024 / 640; }
  .op-keyshot .envkey { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 22px rgba(0,0,0,.5)); }
  .op-keyshot.play .op-keyshot-in { animation: rise .45s ease-out both; }
  .op-keyshot.play .envkey { animation: keyslide 1.2s .2s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes keyslide { from { transform: translate(-3%, -4%) rotate(-2deg) scale(.96); } to { transform: none; } }
  @keyframes unfold { from { transform: scaleY(.82) translateY(-12px); } to { transform: none; } }
  /* 拖曳推門 */
  .op-door { width: 150px; height: 190px; border-radius: 6px 6px 0 0; background: #f3dfb8; box-shadow: inset 0 0 30px rgba(255,190,90,.8), 0 0 30px rgba(255,200,120,.35);
    touch-action: none; cursor: grab; outline: none; }
  .op-door-panel { position: relative; width: 100%; height: 100%; border-radius: 6px 6px 0 0; background: linear-gradient(90deg, #6b4528, #7b4f2f);
    transform-origin: 0 50%; transition: transform .5s cubic-bezier(.3,1.4,.5,1); display: flex; align-items: center; justify-content: center;
    border: 3px solid #4a2f1a; }
  .op-door-text { color: #f6efe2; font-size: 16px; font-weight: 600; letter-spacing: 2px; writing-mode: vertical-rl; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .op-door.nudge .op-door-panel { animation: nudge .5s ease-in-out; }
  @keyframes nudge { 30% { transform: perspective(600px) rotateY(-14deg); } 60% { transform: perspective(600px) rotateY(-4deg); } }

  /* ---------- 開場：閱讀框（第三幕推門後～第四幕；沿用故事閱讀框的樣式） ---------- */
  #op-read { position: absolute; inset: 0; z-index: 22; pointer-events: none; }
  #op-read.waiting { pointer-events: auto; cursor: pointer; }
  #op-read .opr-hot { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .opr-hotspot { position: absolute; padding: 0; pointer-events: auto; background: transparent; border-radius: 50%; box-shadow: none; cursor: pointer;
    animation: hotglow 1.8s ease-in-out infinite; }
  .opr-hotspot:disabled { animation: none; opacity: 0; pointer-events: none; }
  @keyframes hotglow { 0%, 100% { box-shadow: inset 0 0 10px rgba(255,236,190,.15), 0 0 0 0 rgba(255,236,190,0); }
    50% { box-shadow: inset 0 0 18px rgba(255,236,190,.4), 0 0 22px 4px rgba(255,236,190,.45); } }
  /* 通用提示規則：目標物呼吸光圈加箭頭（▼ 指著熱點，點過就跟著熱點一起收起來） */
  .opr-hotspot::after { content: "▼"; position: absolute; left: 50%; top: -26px; transform: translateX(-50%); font-size: 16px; line-height: 1; color: #ffe7b0;
    text-shadow: 0 1px 4px rgba(0,0,0,.85); animation: bob 1s ease-in-out infinite; pointer-events: none; }
  .opr-hotspot:disabled::after { content: none; }
  @keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: 5px; } }
  /* 三合院外（傍晚／晚上） */
  .op-yard { padding: 0; background: #1f1a22; }
  .op-art { position: absolute; left: 50%; top: -9%; height: 100%; aspect-ratio: 1170 / 2532; transform: translateX(-50%); overflow: hidden; }
  .op-yard.no-box .op-art { top: 0; }
  .op-art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1.4s ease; transform-origin: 58.5% 63.3%; }
  /* 夜景原圖本身有燈光：不再套濾鏡壓暗；推門後只加門口的暖光、往門口推近 */
  .op-glow { position: absolute; border-radius: 50%; opacity: 0; transition: opacity 1s; pointer-events: none; mix-blend-mode: screen; }
  .op-glow.door { left: 39.5%; top: 52.2%; width: 38%; height: 22%; background: radial-gradient(closest-side, rgba(255,214,140,.9), rgba(255,200,120,0)); }
  .op-yard.lit .op-glow.door { opacity: 1; }
  .op-yard.lit .op-art-img { transform: scale(1.06); }
  .op-card { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: #0d0b0a; transition: opacity .8s; }
  .op-card p { margin: 0; font-size: 21px; letter-spacing: 6px; color: #f1ece2; animation: floatin 1.6s ease-out both; }
  .op-card.out { opacity: 0; }
  /* 推門：畫師去背雙扇門（art-map.js 的 door_*，皆 1170×2532 對齊層，整張疊上）。圖層：暖光 → 固定扇 → 活動扇（關／開一道縫／全開）→ 台階上的貓（z-index 3）。
     活動扇三張的不透明度由 view/opening.js 的 leafMix 設（拖曳時跟著手、放開淡換）；推門後跟底圖一起往門口推近 */
  .op-door-art { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: transform 1.4s ease; transform-origin: 58.5% 63.3%; }
  .op-door-art img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .25s ease; }
  .op-door-art.dragging img { transition: none; }
  .op-yard.lit .op-door-art { transform: scale(1.06); }
  /* 推門熱區：疊在活動扇上（觀眾面對大門的右扇，原圖 1170×2532 的 (685,1506)–(748,1706)）；透明，只有呼吸光圈與程式疊的「推門進去」，不畫門板、不畫門把 */
  .op-door-wrap { position: absolute; left: 58.547%; top: 59.479%; width: 5.385%; height: 7.899%; z-index: 2; }
  .op-yard .op-door { position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; min-width: 44px; min-height: 44px; transform: translate(-50%, -50%);
    background: transparent; border-radius: 3px 3px 0 0; animation: doorcall 2.2s ease-in-out infinite; }
  .op-yard .op-door.open { animation: none; }
  /* 門推開後：推門熱區與「推門進去」淡出、藏起來；門圖層停在全開 */
  .op-door-wrap.gone { opacity: 0; pointer-events: none; transition: opacity 1s ease; }
  .op-yard .op-door-panel { border: 0; background: transparent; transform: none; }
  .op-yard .op-door.nudge .op-door-panel { animation: none; }
  .op-yard .op-door-text { font-size: 13px; letter-spacing: 3px; }
  @keyframes doorcall { 0%, 100% { box-shadow: inset 0 0 20px rgba(255,190,90,.6), 0 0 6px rgba(255,214,140,.25); } 50% { box-shadow: inset 0 0 20px rgba(255,190,90,.6), 0 0 18px 4px rgba(255,214,140,.65); } }
  /* 機車（畫師原圖 _v2 800×520，off／on／beam 三張對齊）：停在門前埕上、台階右邊，車頭朝左，不擋門（門 50.8%–66.3%），
     車身（原圖 x155–644）落在約 66.9%–92.0%，390 寬不裁到右緣。位置寫成變數，路面光錐跟著同一組數字算 */
  .op-yard { --sc-l: 59%; --sc-t: 65.7%; --sc-w: 41%; }
  .op-scooter { position: absolute; left: var(--sc-l); top: var(--sc-t); width: var(--sc-w); aspect-ratio: 800 / 520; z-index: 1; pointer-events: none; }
  /* 路面光錐（prop_v3b_scooter_road_light_v2，1400×720）：與機車同比例（scale＝機車寬／800），錨點 (1330,110) 對準前輪著地點 (232,493)：
     left＝機車 left − 1098×scale、top＝機車 top ＋ 383×scale（top 的 % 是相對畫高，寬度 % 要乘 1170／2532 換算）。
     車頭朝左，不翻轉。疊在機車下層、背景上層；發動後與車燈一起淡入 */
  .op-road-light { position: absolute; left: calc(var(--sc-l) - var(--sc-w) * 1098 / 800); top: calc(var(--sc-t) + var(--sc-w) * 383 / 800 * 1170 / 2532);
    width: calc(var(--sc-w) * 1400 / 800); aspect-ratio: 1400 / 720; z-index: 1; pointer-events: none; mix-blend-mode: screen; opacity: 0; transition: opacity .6s; }
  .op-yard.beam .op-road-light { opacity: .8; }
  .op-scooter img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .op-scooter .off, .op-scooter .on { filter: brightness(.86) sepia(.12) drop-shadow(0 4px 5px rgba(0,0,0,.45)); }
  .op-yard.night .op-scooter .off, .op-yard.night .op-scooter .on { filter: brightness(.58) saturate(.8) drop-shadow(0 4px 5px rgba(0,0,0,.55)); }
  .op-scooter .on, .op-scooter .beam { opacity: 0; transition: opacity .35s; }
  .op-scooter .beam { mix-blend-mode: screen; transition-duration: .6s; }
  .op-yard.beam .op-scooter .on, .op-yard.beam .op-scooter .beam { opacity: 1; }
  .op-yard.beam .op-scooter .off { opacity: 0; transition: opacity .35s; }
  /* 台階上睡著的龍眼（原圖無貓，疊 cat_longan_sleep）；回來時換了一邊睡（另一張原圖 cat_longan_sleep_flip_v2，不翻轉舊圖）；
     門一開：醒來伸懶腰（cat_longan_stretch_v3b_v2），然後往門那邊鑽進去（淡出） */
  .op-step-cat { position: absolute; left: 44.4%; top: 65.8%; width: 11%; z-index: 3; pointer-events: none; filter: brightness(.8) saturate(.85) drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
  .op-yard.night .op-step-cat { filter: brightness(.6) saturate(.8) drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
  .op-step-cat.stretch { opacity: 0; }
  .op-yard.lit .op-step-cat { opacity: 0; transition: opacity .25s; }
  .op-yard.lit .op-step-cat.stretch { animation: catstretch 3.2s .15s ease-in-out both; }
  @keyframes catstretch { 0% { opacity: 0; transform: none; } 10% { opacity: 1; transform: none; } 66% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(70%, -18%) scale(.9); } }
  .op-start { position: absolute; left: 50%; bottom: calc(7% + env(safe-area-inset-bottom)); transform: translateX(-50%); min-width: 160px; z-index: 3; letter-spacing: 4px; }

  /* 黑路、岔路、工寮與土地公廟 */
  .op-night-road { padding: 0; background: #050608; touch-action: none; cursor: pointer; }
  .op-road-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter .45s ease; }
  /* 工寮／土地公廟／掉頭分鏡格疊著時：夜路停下並壓暗；離開工寮的掉頭：短黑幕（不出畫面，只有引擎聲） */
  .op-night-road.sb-dim .op-road-cv { filter: brightness(.4); }
  .op-road-black { position: absolute; inset: 0; z-index: 2; background: #000; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  .op-night-road.blackout .op-road-black { opacity: 1; }
  .op-hold { position: absolute; left: 50%; top: 52%; width: 64px; height: 64px; transform: translate(-50%, -50%); pointer-events: none; opacity: .85; animation: blink 1.8s ease-in-out infinite; }
  .op-hold.down { animation: none; opacity: 1; }
  .op-hold svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .op-hold .bg { fill: rgba(10,10,10,.35); stroke: rgba(255,240,210,.35); stroke-width: 3; }
  .op-hold .fg { fill: none; stroke: #ffe7b0; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 163.4; stroke-dashoffset: 163.4; }
  .op-hold .arrow { fill: none; stroke: #ffe7b0; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; transform: rotate(90deg); transform-origin: 32px 32px; }
  .op-fork { position: absolute; top: 16%; width: 46%; height: 30%; z-index: 3; background: transparent; box-shadow: none; border-radius: 0; color: #ffe7b0; font-size: 52px; }
  .op-fork span { display: inline-block; text-shadow: 0 0 14px rgba(255,214,140,.9); animation: forkcall 1.8s ease-in-out infinite; }
  .op-fork.right span { animation-name: forkcallr; }
  @keyframes forkcall { 0%, 100% { opacity: .55; transform: translateX(0); } 50% { opacity: 1; transform: translateX(-6px); } }
  @keyframes forkcallr { 0%, 100% { opacity: .55; transform: translateX(0); } 50% { opacity: 1; transform: translateX(6px); } }
  .op-fork.left { left: 3%; }
  .op-fork.right { right: 3%; }
  .op-fork:disabled { animation: none; opacity: 0; transition: opacity .4s; }
  .op-fork.picked:disabled { opacity: .5; }
  .op-turnback { position: absolute; left: 50%; bottom: calc(var(--box-h) + 22px); transform: translateX(-50%); min-width: 160px; z-index: 3; letter-spacing: 2px; animation: floatin .8s ease-out both; }

  /* 庭埕（晚上）→ 護龍的房間（畫師原圖 1170×2532） */
  .op-room-act { padding: 0; background: #0d0f16; }
  .op-yardnight, .op-room { position: absolute; inset: 0; transition: opacity 1.1s; }
  .op-room-act .op-art { top: 0; }
  .op-room { opacity: 0; }
  .op-room-act.in-room .op-yardnight { opacity: 0; }
  .op-room-act.in-room .op-room { opacity: 1; }
  /* 庭埕原圖無貓：龍眼跟到一半，坐在庭埕中間那片燈光裡 */
  .op-yn-cat { position: absolute; left: 38.7%; top: 54.2%; width: 24%; pointer-events: none; filter: brightness(.82) sepia(.15) drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
  /* 房間原圖已有床、衣櫃、窗、床頭燈（燈一直亮）；鑰匙放在枕頭旁邊（疊 key）；床是可點的熱點 */
  .op-rm-key { position: absolute; left: 52%; top: 37.6%; width: 12%; transform: rotate(-12deg); pointer-events: none; filter: brightness(.85) sepia(.2) drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .op-rm-bed { position: absolute; left: 33%; top: 34%; width: 66%; height: 28%; min-width: 44px; min-height: 44px; z-index: 1; }
  /* 躺下：切到躺在床上的視角（畫師原圖 scene_v3b_bed_pov_night，床頭燈一直亮著） */
  .op-bedpov { position: absolute; inset: 0; opacity: 0; transition: opacity 1s; }
  .op-room-act.lying .op-bedpov { opacity: 1; }

  /* 待續 */
  .op-end { background: radial-gradient(120% 80% at 50% 38%, #2a1f18, #0d0b0a 70%); justify-content: center; align-items: center; text-align: center; }
  .op-end-lamp { width: 90px; height: 90px; margin-bottom: 18px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,214,150,.6), rgba(255,214,150,0)); animation: floatin 2.4s ease-out both; }
  .op-end-title { margin: 0 0 40px; font-size: 24px; letter-spacing: 12px; color: #f1ece2; animation: floatin 2.4s .5s ease-out both; }
  .op-end-again { background: transparent; color: rgba(241,236,226,.9); border: 1px solid rgba(241,236,226,.5); box-shadow: none; min-width: 180px; animation: floatin 2s 1.4s ease-out both; }

  /* ---------- 睡前自白：獨立的「跳過自白」按鈕（字在 view/reader.js 的 SKIP_LABEL；右上角，離正文很遠；剛出現的一小段時間淡入、不收點。只有自白期間才顯示） ---------- */
  #op-read .opr-skip { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 58px; z-index: 4; min-width: 96px; min-height: 44px; padding: 8px 16px;
    pointer-events: auto; font-size: 14px; letter-spacing: 1px; color: #f1ece2; background: rgba(20,16,12,.55); border: 1px solid rgba(241,236,226,.45); box-shadow: none; }
  #op-read .opr-skip.arm { animation: skiparm .9s ease-out both; }
  @keyframes skiparm { from { opacity: 0; } 70% { opacity: .2; } to { opacity: 1; } }
  .st-aside { color: #7a6656; }
  .st-line.msg .st-text { display: inline-block; padding: 4px 12px; border-radius: 14px 14px 14px 4px; background: #e8f0e0; }
  .st-line.note .st-text { font-family: "Kaiti TC", "DFKai-SB", "BiauKai", serif; }
  .st-line.mono .st-text { color: #4b3a2e; }

  /* ---------- 第一～四天：整張背景圖的畫面（view/days.js）；沒原圖的場景用最接近的圖（見 docs/v3b-缺圖清單.md） ---------- */
  .op-day { padding: 0; background: #14110e; }
  .dy-place { position: absolute; inset: 0; opacity: 0; transition: opacity .9s; }
  .dy-place.on { opacity: 1; }
  .dy-place.wide .op-art-img { object-position: 66% 60%; }
  .dy-place .op-art::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .dy-place.morning .op-art::after { background: linear-gradient(rgba(255,238,205,.42), rgba(255,236,210,.18)); mix-blend-mode: screen; }
  .dy-place.dusk .op-art::after { background: linear-gradient(rgba(235,140,70,.32), rgba(120,60,30,.28)); mix-blend-mode: multiply; }
  .dy-place.lit .op-glow.door { opacity: 1; }
  .dy-lady { position: absolute; width: auto; transform: translateX(-50%); pointer-events: none; opacity: .95; z-index: 1; }
  .dy-key, .dy-can { opacity: 0; transition: opacity .6s; }
  .op-day.key .dy-key { opacity: 1; }
  .dy-can.on-pillow { position: absolute; left: 47%; top: 35%; width: 7%; aspect-ratio: 3 / 4; border-radius: 3px; background: linear-gradient(90deg, #6f6a62, #b9b2a5 40%, #7c766c); }
  .op-day.can .dy-can { opacity: 1; }
  .dy-dark { position: absolute; inset: 0; background: rgba(5,6,10,.6); opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  .op-day.dark .dy-dark { opacity: 1; }
  /* 整張疊上的透明對齊層（1170×2532，和底圖同尺寸；view/days.js 的 layer()） */
  .dy-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* 洗臉（早晨洗手台底圖 bg_v56_hulong_basin_morning_portrait）：圖層 底圖 → 鏡子裡的角色卡 → 霧氣 → 鏡框前景（fg_basin_mirror）。
     鏡面原圖約 x 458–878、y 588–1215；角色卡框比鏡面略大（x 450–885、y 580–1222），邊緣由鏡框前景蓋住。
     「水很冰。」低頭（.face-down）：鏡子裡沒有角色卡；「我關掉銅色的水龍頭抬起頭……」淡入 */
  .dy-mirror { position: absolute; left: 38.462%; top: 22.907%; width: 37.179%; height: 25.355%; overflow: hidden; pointer-events: none; }
  .dy-face { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; pointer-events: none; opacity: 1; transition: opacity .9s ease; }
  .op-day.face-down .dy-face { opacity: 0; }
  .dy-fog { position: absolute; inset: 0; background: rgba(240,244,244,.0); }
  .dy-place.washing .dy-fog { animation: fog 2.6s ease-in-out both; }
  @keyframes fog { 30% { background: rgba(240,244,244,.75); } to { background: rgba(240,244,244,0); } }
  /* 銅色水龍頭（原圖約 x 615–760、y 1290–1530）：透明熱點（可選，不點也能翻頁）；淡藍水流從出水口（約 x 632、y 1440）流到洗手台 */
  .dy-faucet { position: absolute; left: 52.564%; top: 50.948%; width: 12.393%; height: 9.479%; min-width: 44px; min-height: 44px; z-index: 2; border-radius: 8px; }
  .dy-switch { position: absolute; left: 80%; top: 26%; width: 5%; height: 3.5%; z-index: 2; border-radius: 3px; background: #f1ede4; box-shadow: inset 0 0 0 2px #c8c1b2; }
  .dy-water { position: absolute; left: 53.7%; top: 56.9%; width: 1.2%; height: 4.7%; border-radius: 0 0 40% 40%; background: linear-gradient(rgba(190,222,240,.85), rgba(170,210,235,.55)); opacity: 0; }
  .dy-place.washing .dy-water { animation: water 2.2s ease-in-out both; }
  @keyframes water { 10%, 80% { opacity: 1; } }
  /* 第一天的空信箱（art-map.js 的 bg_mailbox＝定版圖 scene_mailboxes_empty，1950×1200 橫圖，門都關著、沒有信封）：
     這一幕專用橫式圖框（1950/1200），整張圖放進框裡（contain，不切掉左右的門）；熱點與格口的百分比都相對原圖。
     可點的那一格（#dy-mailslot，位置由 days.js 的 MAILBOX_HOT_CELL 寫在 style）點了門往外打開，裡面是深色的空格口。不出信封、不出單子 */
  .dy-place.mbox { background: #1b1d1b; }
  .dy-place.mbox .op-art { top: 9%; height: auto; width: min(100%, calc(58vh * 1950 / 1200)); aspect-ratio: 1950 / 1200; }
  .dy-place.mbox .op-art-img { object-fit: contain; }
  .dy-mailslot { position: absolute; z-index: 1; }
  .dy-mb-hole { position: absolute; border-radius: 2px; background: #161718; box-shadow: inset 0 6px 10px rgba(0,0,0,.85); perspective: 400px; opacity: 0; transition: opacity .15s; }
  .dy-mb-door { position: absolute; inset: 0; border-radius: 2px; background: linear-gradient(#b3bdb4, #97a29a); box-shadow: inset 0 0 0 2px #7b857d; transform-origin: 0 50%; transition: transform .6s ease; }
  .dy-mb-door::after { content: ""; position: absolute; left: 12%; width: 70%; top: 18%; height: 11%; border-radius: 2px; background: #1f2221; }
  .dy-place.open .dy-mb-hole { opacity: 1; }
  .dy-place.open .dy-mb-door { transform: rotateY(-72deg); }
  /* 衣櫃最底層的抽屜（卡住，再點一次才拉得開）；撥開衣服，底下露出資料袋 */
  .dy-drawer { position: absolute; left: 8%; top: 56%; width: 44%; height: 9%; z-index: 1; border-radius: 3px;
    background: linear-gradient(#8b6440, #6e4c2f); box-shadow: inset 0 0 0 3px #5a3d26; transition: transform .6s ease; }
  .dy-place.stuck .dy-drawer { transform: translateY(6%); }
  .dy-place.open .dy-drawer { transform: translateY(40%); }
  .dy-clothes { position: absolute; inset: 8% 6%; display: flex; gap: 4%; opacity: 0; transition: opacity .4s; }
  .dy-place.open .dy-clothes { opacity: 1; }
  .dy-clothes i { flex: 1; border-radius: 4px; background: #7b8794; transition: transform .4s; }
  .dy-clothes i:nth-child(2) { background: #c9b48e; }
  .dy-clothes i:nth-child(3) { background: #2f4a6b; }
  .dy-place.moved1 .dy-clothes i:nth-child(1) { transform: translateY(-140%); }
  .dy-place.moved2 .dy-clothes i:nth-child(2) { transform: translateY(-140%); }
  .dy-place.moved3 .dy-clothes i:nth-child(3) { transform: translateY(-140%); }
  .dy-place.bag .dy-drawer::after { content: ""; position: absolute; left: 30%; top: 25%; width: 40%; height: 55%; border-radius: 4px; background: rgba(220,226,230,.75); }
  /* 會議室桌上的報告 */
  .dy-report { position: absolute; left: 34%; top: 60%; width: 32%; height: 9%; z-index: 1; border-radius: 2px; background: linear-gradient(#fbfaf6, #e8e4d8); box-shadow: 0 3px 6px rgba(0,0,0,.3); transform: rotate(-3deg); }

  /* ---------- 疊在閱讀框上面的一層：特寫卡、要拖的東西、關卡、兩個按鈕（#op-prop） ---------- */
  #op-prop { position: absolute; inset: 0; z-index: 23; pointer-events: none; }
  .pp-card { position: absolute; left: 50%; top: 16%; transform: translateX(-50%) scale(.96); opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none; }
  .pp-card.on { opacity: 1; transform: translateX(-50%); }
  .pp-card.badge img { display: block; width: min(56vw, 210px); filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .pp-passbook { position: relative; width: 150px; height: 196px; border-radius: 6px; background: linear-gradient(135deg, #2f5a4a, #234537); box-shadow: 0 10px 22px rgba(0,0,0,.45); }
  .pp-passbook i { position: absolute; left: 14%; right: 14%; height: 3px; background: rgba(240,235,220,.0); }
  .pp-bag { width: 230px; height: 160px; border-radius: 8px; background: rgba(214,222,226,.85); box-shadow: 0 10px 22px rgba(0,0,0,.35), inset 0 8px 0 #9aa4aa; display: flex; align-items: center; justify-content: center; }
  .pp-bag span { padding: 6px 10px; background: #fbf8ef; font-size: 15px; letter-spacing: 1px; color: #3a2e25; transform: rotate(-2deg); }
  .pp-phone { position: relative; width: 150px; height: 290px; border-radius: 22px; border: 7px solid #2c2622; background: linear-gradient(#f4f6f4, #e2e8e2); box-shadow: 0 10px 26px rgba(0,0,0,.45); }
  .pp-input { position: absolute; left: 8px; right: 8px; bottom: 10px; min-height: 44px; border-radius: 22px; background: #fff; box-shadow: inset 0 0 0 1px #b8c0b8; display: flex; align-items: center; padding: 0 12px; font-size: 15px; }
  .pp-input.live { pointer-events: auto; cursor: pointer; box-shadow: inset 0 0 0 2px #e0b86a, 0 0 14px rgba(224,184,106,.7); }
  .pp-input.sent { box-shadow: inset 0 0 0 1px #b8c0b8; }
  .pp-report { position: relative; width: 250px; height: 170px; border-radius: 2px; background:
    repeating-linear-gradient(0deg, transparent 0 20px, #d8d3c6 20px 21px), repeating-linear-gradient(90deg, #fbfaf6 0 49px, #d8d3c6 49px 50px); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
  .pp-cell { position: absolute; left: 100px; top: 63px; width: 50px; height: 21px; background: rgba(240,200,90,.55); }
  .pp-box { position: relative; width: 230px; height: 150px; border-radius: 4px; background: linear-gradient(#c9a172, #a8804f); box-shadow: 0 10px 22px rgba(0,0,0,.4); }
  .pp-box i { position: absolute; left: 0; right: 0; height: 18%; background: rgba(214,190,140,.9); transition: opacity .3s; }
  .pp-box .t1 { top: 20%; } .pp-box .t2 { top: 42%; } .pp-box .t3 { top: 64%; }
  .pp-box.torn1 .t1, .pp-box.torn2 .t2, .pp-box.torn3 .t3 { opacity: 0; }

  /* ---------- 劇本 v5.6（第一天～研發咖啡）：定版場景上的熱點、小圖、新特寫卡（圖見 src/view/art-map.js；v5.6 新圖在 assets/art-v56/） ---------- */
  /* 座標都是 .op-art 的百分比＝直式原圖（1170×2532）上的位置；原圖不改 */
  .dy-css { position: absolute; inset: 0; background: #3a332c; } /* 只在缺圖時當底色（定版後沒有場景用到） */
  /* v5.9 超商轉場：提款機淡出後的黑底（整個畫面純黑；切到超商時 .dy-place 的 opacity 交叉淡入） */
  .dy-place[data-place="black"], .dy-css.dy-css-black { background: #000; }
  /* 租屋房間：窗戶下的水痕（原圖 y 1110–1640）在水痕小圖疊上來時亮一下；桌上的錢包、桌子的抽屜（拉開：印章在最裡面，旁邊有一本存簿） */
  .dy-stainspot { position: absolute; left: 41%; top: 43.8%; width: 20.5%; height: 21%; border-radius: 40%; pointer-events: none; opacity: 0; transition: opacity .6s;
    box-shadow: 0 0 0 3px rgba(255,236,190,.55), 0 0 26px 8px rgba(255,226,160,.35); }
  .op-day.mini-stain .dy-stainspot { opacity: 1; }
  /* 超商（定版 bg_v56_store_interior_seating_portrait，承峰 2026-11-22「超商圖定版」）：座位區後牆、吧台上方、窗戶左側畫好一張有框的空白海報。
     熱點＝海報外框（原圖 x 348–646、y 569–977）；字疊在紙面（原圖 x 358–638、y 580–967）＝外框內縮 左 3.356%／上 2.696%／右 2.685%／下 2.451%。
     不再疊 CSS 白紙、膠帶、也不旋轉（不蓋住原圖海報）。程式只疊「誠徵門市人員」（不疊薪水）；提示字「點座位區的徵人海報」（view/hints.js 的 POSTER_HINT）。
     點了以後的特寫是分鏡格 sb_store_poster_v3（.pp-mini.sb.sb-poster；字畫在圖上，分鏡格上不再疊字）。
     .op-art 的比例就是 1170/2532，object-fit: cover 不裁切，百分比直接對到原圖。 */
  .dy-poster { position: absolute; left: 29.744%; top: 22.472%; width: 25.47%; height: 16.114%; z-index: 1; container-type: size; }
  .dy-poster .pp-overlay { position: absolute; left: 3.356%; top: 2.696%; right: 2.685%; bottom: 2.451%; display: flex; align-items: center; justify-content: center;
    font-size: 1.9vh; font-size: 12cqh; font-weight: 700; color: #a8302a; letter-spacing: .12em; line-height: 1; writing-mode: vertical-rl; pointer-events: none; }
  /* 花斑貓（cat_huaban_*；不用龍眼貓圖）：村子路從圍牆上跳下來（jump）→ 落地坐著（sit）→ 點了往前走（walk）；院子裡坐著 */
  .dy-calico { position: absolute; aspect-ratio: 4 / 3; z-index: 2; opacity: 0; }
  .dy-calico img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .25s; }
  .dy-calico[data-pose="sit"] .cv-sit, .dy-calico[data-pose="jump"] .cv-jump, .dy-calico[data-pose="walk"] .cv-walk { opacity: 1; }
  .dy-calico.on-wall { left: 42%; top: 61%; width: 32%; transition: opacity .4s, transform 1.4s ease; }
  .op-day.calico-wall .dy-calico.on-wall { opacity: 1; }
  .dy-calico.on-wall[data-pose="jump"] { animation: calicojump .9s ease-in both; }
  @keyframes calicojump { from { transform: translate(-55%, -40%); } to { transform: none; } }
  .op-day.calico-go .dy-calico.on-wall { transform: translate(28%, -42%) scale(.55); }
  .dy-calico.in-yard { left: 52%; top: 70%; width: 22%; transition: opacity .6s; }
  .op-day.calico-yard .dy-calico.in-yard { opacity: 1; }
  /* 坤伯的院子：水桶畫在原圖上；空罐子、立著的肥料罐、地面補丁、牆角水桶都是畫師去背層（art-map.js 的 yard_*），整張疊上。
     空罐子倒在地上（原圖約 x 205–335、y 2030–2110）：#dy-emptycan 是透明熱點（必點）；點了淡出（.can-up），標籤小圖疊著、坤伯拿走之後也不在地上。
     立著的肥料罐一直留著。提水桶那句（.bucket-moved）：地面補丁蓋住原圖的水桶、牆角水桶淡入，之後留著 */
  .dy-emptycan-art { transition: opacity .5s ease; }
  .op-day.can-up .dy-emptycan-art, .op-day.can-label .dy-emptycan-art, .op-day.can-taken .dy-emptycan-art { opacity: 0; }
  .dy-emptycan { position: absolute; left: 17.009%; top: 79.779%; width: 12.137%; height: 3.95%; min-width: 44px; min-height: 44px; z-index: 2; border-radius: 10px; }
  .op-day.can-up .dy-emptycan, .op-day.can-taken .dy-emptycan { pointer-events: none; }
  .dy-bucket-patch, .dy-bucket-corner { opacity: 0; transition: opacity .9s ease; }
  .op-day.bucket-moved .dy-bucket-patch, .op-day.bucket-moved .dy-bucket-corner { opacity: 1; }
  /* 字卡（「第二天」「三天後」、倒數字卡）：沿用 .op-card */
  .op-day.daycard { background: #0d0b0a; }
  /* 倒數字卡（「我單方面辭退老闆前 4 天」「我單方面辭退老闆當天　16:49」）：整句讀得清楚；放不下就換行（字不改），數字不拆開 */
  .op-day.daycard.long .op-card p { max-width: calc(100% - 48px); font-size: 20px; line-height: 1.7; letter-spacing: 3px; text-align: center; word-break: normal; overflow-wrap: anywhere; }

  /* 小圖（#op-prop .pp-mini）：疊在原場景上，背景不切換；先疊上來，點一下才出句子；講完收掉。不畫手 */
  .pp-mini { position: absolute; left: 50%; top: 12%; width: min(64vw, 250px); aspect-ratio: 1; transform: translateX(-50%) scale(.94); opacity: 0;
    transition: opacity .45s, transform .45s; pointer-events: none; border-radius: 10px; overflow: hidden; background: #fbf5e8; border: 6px solid #fbf5e8;
    box-shadow: 0 12px 30px rgba(20,10,5,.5); }
  .pp-mini.on { opacity: 1; transform: translateX(-50%); }
  .pp-mini.ask { animation: doorcall 2.2s ease-in-out infinite; }
  .pp-mini > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pp-mini > div { position: absolute; inset: 0; }
  /* 分鏡格（.pp-mini.sb；承峰 2026-11-24／25 定版八組，咖啡館畫師產圖）：橫式 4:3，寬度同小圖（min(64vw, 250px)）；
     黑框與白邊已畫在圖裡（框是程式做的），這裡不再加框。直排多格（刷存摺 3 格、貓靠近 2 格）是同一張圖，一格一個 .sb-cell，
     依台詞一格一格亮（.lit），還沒亮的格先留位置；整條太高時依畫面高度縮小（--r＝整張圖的高／寬），手機上不蓋到閱讀框。 */
  .pp-mini.sb { aspect-ratio: auto; background: transparent; border: 0; border-radius: 0; overflow: visible; box-shadow: none;
    width: min(64vw, 250px, calc(54vh / var(--r, .75))); width: min(64vw, 250px, calc(54dvh / var(--r, .75))); }
  .pp-mini.sb.strip { top: 5%; }
  .pp-mini.sb > .sb-cell { position: relative; inset: auto; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; opacity: 0; transform: translateY(6px);
    transition: opacity .45s, transform .45s; filter: drop-shadow(0 8px 16px rgba(20,10,5,.45)); }
  .pp-mini.sb > .sb-cell + .sb-cell { margin-top: 3.125%; } /* 原圖格距 64px／寬 2048px */
  .pp-mini.sb > .sb-cell.lit { opacity: 1; transform: none; }
  .pp-mini.sb > .sb-cell > img { position: absolute; left: 0; width: 100%; height: auto; display: block; }
  /* 第二幕開信封：疊在房間畫面上（不在 #op-prop），點一下收掉進信件 */
  .op-letterroom .pp-mini.sb { z-index: 4; pointer-events: auto; cursor: pointer; }
  .pp-overlay { font-weight: 700; letter-spacing: 2px; }
  .mn-on-art { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 30px; color: #b0302a; }
  /* 空罐子小圖（prop_v56_empty_can_label_v2，1024×1024）：標籤留白在 x 285–712、y 533–862，「農藥」疊在留白中央 */
  .pp-mini.mini-label .mn-on-art { left: 48.6%; top: 68%; font-size: 36px; color: #7c1d17; letter-spacing: 6px; white-space: nowrap; }
  .mn-stain { background: linear-gradient(#efe9dc 0 34%, #d9d1c0 34% 38%, #efe9dc 38%); }
  .mn-stain i { position: absolute; left: 22%; top: 40%; width: 58%; height: 44%; border-radius: 48% 52% 40% 60% / 30% 40% 60% 70%; background: radial-gradient(closest-side, rgba(120,88,52,.45), rgba(120,88,52,.12) 70%, rgba(120,88,52,0)); }
  .pp-mini .mn-passbook { position: absolute; inset: 14% 22%; width: auto; height: auto; }
  .mn-hat { background: linear-gradient(#e9f0f2, #d5dfe2); }
  .mn-hat i { position: absolute; left: 12%; right: 12%; top: 30%; height: 38%; background: linear-gradient(#d8bf86, #b89a5e); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .mn-label { background: #9a948a; }
  .mn-label .mn-tag { position: absolute; left: 14%; right: 14%; top: 30%; height: 40%; display: flex; align-items: center; justify-content: center; background: #f2ecd8;
    box-shadow: inset 0 0 0 3px #c9bfa3; font-size: 34px; color: #b0302a; }
  .mn-longan { background: #3a2a1e; }
  .mn-longan i { position: absolute; left: 22%; top: 24%; width: 56%; height: 52%; border-radius: 50%; background: radial-gradient(circle at 40% 36%, #3d2a1c, #1f150e 70%); box-shadow: 0 0 0 10px #8a6038, 0 0 0 12px #6e4a2a; }
  .mn-longan i + i { left: 56%; top: 54%; width: 24%; height: 22%; background: #8a6038; box-shadow: none; }
  /* 徵人海報特寫、測試品的紙袋都已改成分鏡格（.pp-mini.sb；海報是 sb_store_poster_v3，字畫在圖上，不再有 CSS 白紙卡） */
  /* 點一下才出句子的整片點擊區（小圖疊上來時） */
  .pp-peek { position: absolute; inset: 0; z-index: 1; padding: 0; background: transparent; box-shadow: none; border-radius: 0; cursor: pointer; }
  .pp-tapitem { cursor: pointer; }

  /* ---------- 劇本 v5.8：開場（離職申請單、下班、房間裡那封信、信後旁白）、第一天早上把鑰匙拖向德叔、提示字 ---------- */
  .op-form-title { margin: 0 0 6px; padding-bottom: 4px; font-size: 15.5px; font-weight: 700; letter-spacing: 3px; text-align: center; border-bottom: 1px solid #d6d9de; }
  .op-mail .op-sign { margin: 0; text-align: left; }
  .op-to { margin: 0; }
  .op-leave { margin: 4px 0 0; }
  .op-title-block { display: block; padding: 24px 12px 4px; }
  .op-title #op-next { min-width: 160px; letter-spacing: 4px; animation: floatin 2s 1.2s ease-out both; }
  /* 第二幕：租屋處房間（暫代 v5.6 房間原圖，疊傍晚色調）；桌上的牛皮紙信封；下方旁白框 */
  .op-letterroom { padding: 0; background: #1c1712; }
  .op-letterroom .op-art { top: -6%; }
  /* 摺疊桌上的信封：畫師去背層（1170×2532 對齊層，pp_envelope 合著／pp_envelope_opened 拆過），只是擺著（img、aria-hidden、不收點）。
     傍晚光已畫在底圖上，不再疊橘色濾鏡 */
  .op-env-img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; transition: opacity .8s ease; pointer-events: none; }
  .op-letterroom.env-closed .op-env-img.closed, .op-letterroom.env-opened .op-env-img.opened { opacity: 1; }
  .op-roombox { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; min-height: var(--box-h); padding: 24px 22px calc(22px + env(safe-area-inset-bottom)); background: #fbf5e8;
    border-top: 5px solid var(--wood); box-shadow: 0 -6px 20px rgba(30,15,5,.35); cursor: pointer; }
  .op-roombox .op-caption { text-align: left; font-size: 19px; line-height: 1.6; color: #4b3a2e; opacity: 1; }
  .op-roombox.done .st-more { visibility: hidden; }
  .op-hint { position: absolute; left: 0; right: 0; bottom: calc(var(--box-h) + 14px); z-index: 3; margin: 0; text-align: center; font-size: 15px; letter-spacing: 1px; color: #ffe7b0;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); animation: floatin .8s ease-out both; pointer-events: none; }
  /* 信後旁白：一句一句點 */
  button.op-after { flex: none; background: transparent; box-shadow: none; color: inherit; border-radius: 0; padding: 6px 8px; min-height: 44px; }
  button.op-after .st-more { display: inline-block; margin-left: 6px; color: #f1ece2; }
  button.op-after.done .st-more { visibility: hidden; }
  /* 接回場：旁白在送出鍵的位置；想起信上那一句用信的字體 */
  .op-office.resend button.op-after { color: #f1ece2; font-size: 16px; line-height: 1.7; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .op-office.resend button.op-after.quote { font-family: "PMingLiU", "MingLiU", "Songti TC", "Noto Serif TC", serif; }
  .op-office.resend #op-next { min-width: 160px; letter-spacing: 4px; animation: floatin 1s ease-out both; }
  /* 特休前一晚：同一間房間；「出發去東山」在旁白框上方 */
  .op-letterroom.eve #op-next { position: absolute; left: 50%; bottom: calc(var(--box-h) + 18px); z-index: 4; min-width: 160px; transform: translateX(-50%); letter-spacing: 2px; }
  /* 第一天早上：把鑰匙拖向德叔（或吧台）：兩個都算；提示字 */
  .pp-zone.to-bar { left: 6%; top: 50%; width: 88%; height: 12%; }
  .pp-hint { position: absolute; left: 0; right: 0; bottom: calc(var(--box-h) + 124px); margin: 0; text-align: center; font-size: 15px; letter-spacing: 1px; color: #ffe7b0;
    text-shadow: 0 1px 4px rgba(0,0,0,.85); pointer-events: none; animation: floatin .8s ease-out both; }
  /* 閱讀框上方的提示字（通用提示規則，字在 src/view/hints.js）：只在那個熱點／關卡還沒做時出現；可選的「（也可以直接翻頁）」小一號 */
  #op-read .opr-hint { position: absolute; left: 0; right: 0; bottom: calc(var(--box-h) + 12px); z-index: 3; margin: 0; padding: 0 12px; text-align: center; font-size: 15px; letter-spacing: 1px;
    color: #ffe7b0; text-shadow: 0 1px 4px rgba(0,0,0,.85); pointer-events: none; animation: floatin .8s ease-out both; }
  #op-read .opr-hint small { font-size: 12px; letter-spacing: 0; opacity: .9; }
  /* 沒有閱讀框的時候（點椅子坐下）：提示字放低，不蓋在椅子上 */
  #op-read.nobox .opr-hint { bottom: calc(14% + env(safe-area-inset-bottom)); }
  /* 分鏡格疊上來等點的時候：提示字貼著格子（單格在正上方、直排在最後一格正下方；view/days.js 的 sbHintTop 量好 --sb-hint-top），不壓到地上的貓與人物立繪 */
  #op-read.sb-hint .opr-hint { top: var(--sb-hint-top); bottom: auto; }
  .op-letterroom .op-hint.sb-under { top: var(--sb-hint-top); bottom: auto; }
  /* 第二天：把鑰匙放到吧台（框上寫「吧台」）。在店內定景上由 days.js 依吧台檯面（shop-still.js 的 SHOP_BAR）改成 px 位置；
     下面的百分比只是量不到吧台時的退路 */
  .pp-zone.bar-drop { left: 14%; top: 44%; width: 72%; height: 11%; }
  .pp-zone.bar-drop::after { content: attr(data-label); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 14px; letter-spacing: 4px;
    color: #ffe7b0; text-shadow: 0 1px 4px rgba(0,0,0,.85); }

  /* ---------- 店內 2D 定景（src/view/shop-still.js；店內環景已拔掉） ----------
     背景是 art-map.js 的 SHOP_STILL_NIGHT／SHOP_STILL_DAY／SHOP_STILL_DUSK（進門／站著：scene_shop_interior_night_lit_v2；答謝開頭傍晚：art-v59/scene_shop_interior_dusk_v1）與
     SHOP_STILL_SEATED（坐下喝咖啡：scene_v3b_shop_window_night_seated）；
     座標都是 .op-art 的百分比＝原圖（1170×2532）上的位置。燈是亮的：不再疊壓暗的濾鏡 */
  /* 前後遮擋（y-sort）：家具切片 .sh-piece、德叔、杯子、貓都在 .sh-cam 同一個 stacking context，z-index 由 shop-still.js 依腳線設
     （片＝base、地上的角色＝腳線 y、在家具上的＝那片 base＋1；摸頭的手最高）。--lit：日／傍晚／夜的配光（LIGHT_FILTER） */
  .op-shop { padding: 0; background: #1c130d; --lit: brightness(1); }
  .sh-cam { position: absolute; inset: 0; transition: transform .9s ease; transform-origin: 62% 62%; }
  .sh-piece { position: absolute; pointer-events: none; transition: opacity 1.2s ease; }
  .op-shop[data-frame="side"] .sh-cam { transform: scale(1.07); } /* 靠窗那一側：往窗邊推近一點 */
  /* 坤伯答謝天暗下來：傍晚圖（複製一張疊在上面）淡掉、露出夜景定版圖；時間與 shop-still.js 的 BG_FADE_MS 一致 */
  .sh-bg-old { pointer-events: none; opacity: 1; transition: opacity 1.2s ease, transform 1.4s ease; }
  .sh-sky { position: absolute; mix-blend-mode: screen; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
  .sh-sky[data-kind="dusk"] { background: linear-gradient(rgba(235,150,90,1), rgba(170,110,110,.75) 45%, rgba(90,70,60,.5)); }
  .sh-sky[data-kind="morning"] { background: linear-gradient(rgba(190,215,235,.95), rgba(230,225,200,.7)); }
  .sh-deshu { position: absolute; width: auto; transform: translateX(-50%); pointer-events: none; filter: var(--lit) drop-shadow(0 4px 8px rgba(30,15,5,.45)); transition: filter 1.2s; }
  /* 接觸陰影：腳底一條扁橢圓（德叔、貓同一種；杯子沿用 drop-shadow） */
  .sh-deshu-shadow, .sh-cat-shadow { position: absolute; pointer-events: none; transform: translateY(-50%);
    background: radial-gradient(closest-side, rgba(20,10,4,.5), rgba(20,10,4,.22) 60%, transparent); }
  .sh-deshu-shadow { height: .9%; }
  .sh-cat-shadow { height: 9%; }
  .sh-chair, .sh-bar { position: absolute; z-index: 1; pointer-events: none; }
  .sh-cup { position: absolute; width: auto; transform: translateX(-50%); transform-origin: 50% 100%; pointer-events: none; filter: var(--lit) drop-shadow(0 2px 3px rgba(0,0,0,.4)); transition: filter 1.2s; }
  .sh-cup.sip { animation: sip 1.5s ease-in-out; }
  @keyframes sip { 50% { translate: -60% -120%; scale: 1.35; } }
  .sh-cat { position: absolute; aspect-ratio: 512 / 384; pointer-events: none; }
  .sh-cat.flip, .sh-hand-box.flip { scale: -1 1; }
  .sh-cat.bob { animation: catbob .3s ease-in-out infinite alternate; }
  @keyframes catbob { from { translate: 0 0; } to { translate: 0 -1.8%; } }
  .sh-cat-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 100%; filter: var(--lit); transition: filter 1.2s; }
  /* 摸頭的手的框：與頂頭圖的貓框同位置（shop-still.js 設），是 .sh-cat 的兄弟、z 最高，不跟著貓被家具擋 */
  .sh-hand-box { position: absolute; aspect-ratio: 512 / 384; pointer-events: none; }
  /* 摸頭：怡君的手（char_v3b_yijun_hand_v2，800×600）與貓圖同比例，指尖 (332,147) 對準頂頭圖的頭頂 (205,58)；袖口淡掉，從上方伸進來再收回去 */
  .sh-hand { position: absolute; left: -24.8%; top: -23.2%; width: 156.25%; height: auto; opacity: 0; pointer-events: none;
    -webkit-mask-image: linear-gradient(transparent, #000 8%); mask-image: linear-gradient(transparent, #000 8%); }
  .sh-hand.go { animation: pethand 2.8s ease-in-out both; }
  @keyframes pethand { 0% { opacity: 0; transform: translateY(-32%); } 18% { opacity: 1; transform: none; } 30% { transform: translate(1.2%, -.7%); }
    42% { transform: translate(-1%, .6%); } 54% { transform: translate(1.2%, -.7%); } 66% { transform: translate(-1%, .6%); } 82% { opacity: 1; transform: none; }
    100% { opacity: .4; transform: translateY(-32%); } }
</style>
